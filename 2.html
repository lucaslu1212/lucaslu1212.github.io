      </div>
      ${renderDqExpiryBanner()}
    </div>

    <!-- 题目卡片 -->
    <div style="background:#fff;border-radius:12px;padding:20px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);">
      <div style="font-size:.8rem;color:#999;margin-bottom:8px;">第 ${idx+1} 题 · ${{choice:'选择题',truefalse:'判断题',fill:'填空题',matching:'连线题',sort:'排序题',selectfill:'下拉填空',material:'材料题'}[q.type]||q.type}</div>
      <div style="font-size:1rem;color:#1a1a1a;line-height:1.7;margin-bottom:16px;">${q.type === 'selectfill' ? '' : (q.content||'')}</div>
      ${q.image ? `<img src="/uploads/questions/${q.image}" style="max-width:100%;border-radius:8px;margin-bottom:12px;">` : ''}
      <div id="dqAnswerArea">${answerHtml}</div>
    </div>

    <!-- 操作按钮 -->
    <div style="display:flex;gap:10px;justify-content:space-between;">
      <button class="btn btn-outline" onclick="dqPrev()" ${idx===0?'disabled':''}>← 上一题</button>

        ? `<button class="btn btn-primary" onclick="dqNext()">下一题 →</button>`

      }

        }).join('')}

  </div>`;
  setTimeout(() => drawDqMatchingLines(q.id), 100);
  return html;
}

function dqNext() {
  const qs = dqState.shuffledQuestions;
  // 保存当前排序题答案（含材料子题排序）
  const curQ = qs[dqState.currentIdx];
  if (curQ && curQ.type === 'sort') {
    const sortAns = collectSortAnswer(curQ);
    if (sortAns) dqState.answers[curQ.id] = sortAns;
  }
  if (curQ && curQ.type === 'material' && curQ.children) {
    curQ.children.forEach((child, ci) => {
      if (child.type === 'sort') {
        const childWithId = { ...child, id: curQ.id + '_c' + ci };
        const sortAns = collectSortAnswer(childWithId);
        if (sortAns) dqSetMatAns(curQ.id, ci, sortAns);
      }

  if (dqState.currentIdx < qs.length - 1) {
    dqState.currentIdx++;

function dqPrev() {
  const qs = dqState.shuffledQuestions;

  const curQ = qs[dqState.currentIdx];
  if (curQ && curQ.type === 'sort') {

function dqConfirmSubmit() {
  // 保存所有排序题答案（含材料子题排序）
  dqState.shuffledQuestions.forEach(q => {
    if (q.type === 'sort') {
      const sortAns = collectSortAnswer(q);
      if (sortAns) dqState.answers[q.id] = sortAns;
    }
    if (q.type === 'material' && q.children) {
      q.children.forEach((child, ci) => {
        if (child.type === 'sort') {
          const childWithId = { ...child, id: q.id + '_c' + ci };
          const sortAns = collectSortAnswer(childWithId);
          if (sortAns) dqSetMatAns(q.id, ci, sortAns);
        }
      });
    }
  });
  const unanswered = dqState.shuffledQuestions.filter(q => {
    const ans = dqState.answers[q.id];
    return ans === undefined || ans === '' || ans === null;
  });
  if (unanswered.length > 0) {
    if (!confirm(`还有 ${unanswered.length} 道题未作答，确定要提交吗？`)) return;
  } else {
    if (!confirm('确定提交今日答题吗？提交后无法修改。')) return;

async function submitDailyQuiz() {
  const c = document.getElementById('mainContent');
  // 序列化 matching 答案为 JSON 字符串
  const answers = { ...dqState.answers };
  dqState.shuffledQuestions.forEach(q => {
    if (q.type === 'matching' && answers[q.id] && typeof answers[q.id] === 'object') {
      answers[q.id] = JSON.stringify(answers[q.id]);
    }
    // 排序题：从 DOM 收集答案
    if (q.type === 'sort') {
      answers[q.id] = collectSortAnswer(q) || (answers[q.id] || '').toUpperCase();
    }
    // 材料题：序列化 children 中的 matching/sort
    if (q.type === 'material' && answers[q.id] && answers[q.id].children) {
      answers[q.id] = { children: answers[q.id].children.map((c, ci) => {
        if (c && typeof c === 'object') return JSON.stringify(c);
        return c;
      })};
    }
  });

  try {
    const result = await API('/api/daily-quiz/submit', { method: 'POST', body: { studentId: me.id, answers } });
    dqState.submitted = true;
    dqState.submission = { ...result, answers };
    // 更新本地积分显示
    if (result.earnedPoints > 0) {
      me.points = (me.points||0) + result.earnedPoints;
      me.petPoints = (me.petPoints||0) + result.earnedPoints;
      document.getElementById('myPointsBadge').textContent = `⭐ ${me.points}`;
      document.getElementById('myPetPointsBadge').textContent = `🐾 ${me.petPoints}`;
    }
    renderDqResult(c);
  } catch(e) {
    alert(e.message || '提交失败，请重试');
  }
}

//  每日答题结果页：答案文本格式化辅助
// ═══════════════════════════════════════════════
function dqChoiceLetter(v) {
  const m = { '0':'A', '1':'B', '2':'C', '3':'D' };
  const s = String(v == null ? '' : v).trim().toUpperCase();
  return m[s] || s;
}
function dqTryParseObj(v) {
  if (v && typeof v === 'object') return v;
  try { return JSON.parse(v || '{}'); } catch(e) { return {}; }
}
// 学生答案可读化（q 可以是顶层题目或材料题子题）
function dqStuAnsText(q, ans) {
  if (ans == null || ans === '') return '未作答';
  try {
    if (q.type === 'choice') return dqChoiceLetter(ans) || '未作答';
    if (q.type === 'truefalse') return String(ans) === 'true' ? '对' : '错';
    if (q.type === 'selectfill') {
      const blanks = q.blanks || [];
      const obj = dqTryParseObj(ans);
      const txt = blanks.map((b, i) => {
        const v = obj[String(i)];
        return '空' + (i + 1) + '：' + ((v != null && String(v) !== '') ? v : '未填');
      }).join('；');
      return txt || '未作答';
    }
    if (q.type === 'matching') {
      const map = dqTryParseObj(ans);
      const txt = Object.keys(map).map(k => '左' + k + ' → 右' + map[k]).join('；');
      return txt || '未作答';
    }
  } catch(e) {}
  return typeof ans === 'object' ? JSON.stringify(ans) : String(ans);
}
// 正确答案可读化
function dqCorrectText(q) {
  try {
    if (q.type === 'selectfill') return (q.blanks || []).map((b, i) => '空' + (i + 1) + '：' + b.answer).join('；');
  } catch(e) {}
  if (q.answer == null || q.answer === '') return '—';
  try {
    if (q.type === 'choice') return dqChoiceLetter(q.answer);
    if (q.type === 'truefalse') return String(q.answer) === 'true' ? '对' : '错';
    if (q.type === 'matching') {
      const map = dqTryParseObj(q.answer);
      return Object.keys(map).map(k => '左' + k + ' → 右' + map[k]).join('；');
    }
  } catch(e) {}
  return String(q.answer);
}
// 材料题学生答案的 children（兼容数组/对象两种存储形态）
function dqMatStuChildren(sa) {
  if (!sa || !sa.children) return [];
  return Array.isArray(sa.children) ? sa.children : Object.values(sa.children);
}

function renderDqResult(c) {

    return;
  }

  const scoreRate = sub.scoreRate || 0;
  const emoji = scoreRate === 100 ? '🏆' : scoreRate >= 80 ? '🎉' : scoreRate >= 60 ? '👍' : '💪';
  const rateColor = scoreRate >= 80 ? '#10b981' : scoreRate >= 60 ? '#f59e0b' : '#ef4444';

  // 详细结果
  const details = sub.details || [];
  const qs = (quiz && quiz.questionDetails) || [];
  const typeLabel = { choice:'选择题', truefalse:'判断题', fill:'填空题', matching:'连线题', sort:'排序题', selectfill:'下拉填空', material:'材料题', pycode:'Python编程题' };

  const detailHtml = qs.map(q => {

    // 所有题目都显示答案明细；材料题按小题逐条展示
    let ansBlock = '';
    if (q.type === 'material') {
      const children = Array.isArray(q.children) ? q.children : [];
      const stuChildren = (d && d.studentAnswer) ? dqMatStuChildren(d.studentAnswer) : [];
      ansBlock = children.map((child, ci) => {

        return `<div style="font-size:.82rem;margin-left:28px;margin-top:4px;">
          <span style="color:#999;">第${ci + 1}小题（${typeLabel[child.type]||child.type}）</span>

        </div>`;
      }).join('');
      if (!children.length) ansBlock = '';
    } else {
      const stuText = d ? dqStuAnsText(q, d.studentAnswer) : '未作答';
      const corText = dqCorrectText(q);
      ansBlock = `<div style="font-size:.82rem;margin-left:28px;">
        <span style="color:${isCorrect === true ? '#10b981' : '#ef4444'};">你的答案：${stuText}</span>
        <span style="color:#10b981;margin-left:12px;">正确答案：${corText}</span>
      </div>`;
    }

    return `<div style="padding:12px 0;border-bottom:1px solid #f0f0f0;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <span style="color:${iconColor};font-size:1.1rem;">${icon}</span>
        <span style="font-size:.75rem;color:#999;background:#f8fafc;padding:1px 6px;border-radius:8px;">${typeLabel[q.type]||q.type}</span>
        <span style="font-size:.9rem;color:#333;flex:1;">${(q.content||'').replace(/<[^>]*>/g,'').slice(0,50)}${(q.content||'').length>50?'…':''}</span>
      </div>
      ${ansBlock}
    </div>`;
  }).join('');

  c.innerHTML = `
  <div style="max-width:600px;margin:0 auto;">
    <!-- 结果卡 -->
    <div style="background:#fff;border-radius:16px;padding:32px 24px;text-align:center;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);">
      <div style="font-size:3.5rem;margin-bottom:8px;">${emoji}</div>
      <div style="font-size:1.5rem;font-weight:800;color:${rateColor};margin-bottom:4px;">${scoreRate}%</div>
      <div style="font-size:.9rem;color:#888;margin-bottom:20px;">答对 ${sub.correctCount} / ${sub.totalCount} 题</div>
      ${sub.earnedPoints > 0
        ? `<div style="display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:20px;padding:10px 24px;">
            <span style="font-size:1.2rem;">⭐</span>
            <span style="font-weight:700;color:#92400e;font-size:1.1rem;">获得 ${sub.earnedPoints} 积分</span>
          </div>`
        : `<div style="color:#999;font-size:.9rem;">本次未获得积分</div>`
      }
    </div>

    <!-- 详细解析 -->
    <div style="background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);">
      <div style="font-weight:700;font-size:1rem;margin-bottom:12px;">📋 题目详情</div>

    </div>

function spawnPetParticles() {
  var colors = ['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#fd79a8'];
  var pet = document.getElementById('pet3D');
  if (!pet) return;
  var rect = pet.getBoundingClientRect();
  var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  for (var i=0; i<12; i++) {
    var el = document.createElement('div');
    var angle = (i/12)*Math.PI*2;
    var dist = 40 + Math.random()*60;
    var px = Math.cos(angle)*dist, py = Math.sin(angle)*dist;
    var dur = 0.5 + Math.random()*0.5;
    el.style.cssText = 'position:fixed;left:' + cx + 'px;top:' + cy + 'px;width:8px;height:8px;background:' + colors[i%colors.length] + ';border-radius:50%;pointer-events:none;z-index:9999;';
    el.style.setProperty('--px', px + 'px');
    el.style.setProperty('--py', py + 'px');
    el.style.setProperty('--pt', dur + 's');
    el.style.animation = 'particleFly ' + dur + 's ease-out forwards';
    document.body.appendChild(el);
    setTimeout(function(e){ return function(){ e.remove(); }; }(el), dur*1000+100);
  }
}

function spawnPetEvolveParticles() {
  var colors = ['#ff0000','#ff7f00','#ffff00','#00ff00','#0000ff','#8b00ff','#ff1493','#00ffff'];
  var pet = document.getElementById('pet3D');
  if (!pet) return;
  var rect = pet.getBoundingClientRect();
  var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  for (var round=0; round<3; round++) {
    (function(r){
      setTimeout(function(){
        for (var i=0; i<16; i++) {
          var el = document.createElement('div');
          var angle = (i/16)*Math.PI*2 + r*0.3;
          var dist = 60 + r*20 + Math.random()*40;
          var px = Math.cos(angle)*dist, py = Math.sin(angle)*dist;
          var dur = 0.8 + r*0.2;
          el.style.cssText = 'position:fixed;left:' + cx + 'px;top:' + cy + 'px;width:10px;height:10px;background:' + colors[i%colors.length] + ';border-radius:50%;pointer-events:none;z-index:9999;';
          el.style.setProperty('--px', px + 'px');
          el.style.setProperty('--py', py + 'px');
          el.style.setProperty('--pt', dur + 's');
          el.style.animation = 'particleFly ' + dur + 's ease-out forwards';
          document.body.appendChild(el);
          setTimeout(function(e){ return function(){ e.remove(); }; }(el), dur*1000+100);
        }
      }, r*300);
    })(round);
  }
}

var expTimer = null;        // 30秒得分定时器
var expCountdown = null;    // 倒计时刷新器
var expEarnedThisSession = false;  // 本次打开有新得分，关闭时需刷新列表

function updateExpCompleted() {
  if (!me || !me.id) return Promise.resolve();
  return fetch('/api/experience/student-status?studentId=' + me.id)
    .then(function(r) { return r.json(); })
    .then(function(data) {

async function renderExperiencePage() {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">加载中...</div>';

  // 过滤：active=true，且年级班级匹配（空=全部可见）

        html += '<div style="font-size:.82rem;color:#e67e22;font-weight:600;margin-top:4px;">🎯 ' + points + '分 · 体验满30秒自动得分</div>';
      }

  html += '<div id="expOverlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999;flex-direction:column;">';

  html += '</div></div>';
  html += '<iframe id="expFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals" style="flex:1;border:none;width:100%;background:#fff;"></iframe>';

function clearExpTimer() {
  if (expTimer) { clearTimeout(expTimer); expTimer = null; }
  if (expCountdown) { clearInterval(expCountdown); expCountdown = null; }
}

function openExpApp(id, name, points) {
  var overlay = document.getElementById('expOverlay');
  var frame = document.getElementById('expFrame');
  var title = document.getElementById('expTitle');
  if (!overlay) return;
  clearExpTimer();
  expEarnedThisSession = false;
  var statusEl = document.getElementById('expStatus');
  if (statusEl) { statusEl.textContent = ''; statusEl.style.color = '#fbbf24'; }
  title.textContent = '🎮 ' + name;
  frame.src = '/api/experience/' + id + '/html';
  overlay.style.display = 'flex';

  // 已得分的不重复计时；积分为 0 的纯体验应用也不计时
  if (window._expCompleted && window._expCompleted.has(id)) return;
  if (!(points > 0)) return;

  // 满 30 秒自动得分，标题栏实时显示倒计时
  var remain = 30;
  var showCountdown = function() {
    var el = document.getElementById('expStatus');
    if (el) el.textContent = '⏱ 体验满 ' + remain + ' 秒可得 ' + points + ' 积分';
  };
  showCountdown();
  expCountdown = setInterval(function() {
    remain--;
    if (remain > 0) { showCountdown(); return; }
    clearExpTimer();
    var el = document.getElementById('expStatus');
    if (el) el.textContent = '正在发放积分...';
    submitExpStay(id, points);
  }, 1000);
}

function submitExpStay(id, points) {
  var studentId = me ? me.id : null;
  if (!studentId) return;
  fetch('/api/experience/complete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ studentId: studentId, experienceId: id })
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    var statusEl = document.getElementById('expStatus');
    if (result && result.success) {
      if (statusEl) { statusEl.textContent = '✅ 已获得 ' + result.earnedPoints + ' 积分'; statusEl.style.color = '#4ade80'; }
      if (window._expCompleted) window._expCompleted.add(id);
      expEarnedThisSession = true;
      toast('🎉 体验满30秒，获得 ' + result.earnedPoints + ' 积分！', 'success');
    } else {
      if (statusEl) { statusEl.textContent = '⚠️ ' + ((result && result.error) || '提交失败'); statusEl.style.color = '#fbbf24'; }
    }
  })
  .catch(function() {
    var statusEl = document.getElementById('expStatus');
    if (statusEl) { statusEl.textContent = '⚠️ 网络异常，本次未得分'; statusEl.style.color = '#fbbf24'; }
  });
}

function closeExpApp() {
  clearExpTimer();
  var overlay = document.getElementById('expOverlay');
  var frame = document.getElementById('expFrame');
  if (overlay) overlay.style.display = 'none';
  if (frame) frame.src = 'about:blank';
  // 本次有新得分 → 重新渲染列表，卡片立即显示"已完成"
  if (expEarnedThisSession) {
    expEarnedThisSession = false;
    renderExperiencePage();
  }
}

async function doChangePassword() {
  var current = document.getElementById('pwdCurrent').value.trim();
  var newPwd = document.getElementById('pwdNew').value.trim();
  var newConfirm = document.getElementById('pwdNewConfirm').value.trim();
  if (!current) { toast('请输入当前密码','error'); return; }
  if (!newPwd) { toast('请输入新密码','error'); return; }
  if (newPwd.length < 4) { toast('新密码至少4位','error'); return; }
  if (newPwd !== newConfirm) { toast('两次新密码不一致','error'); return; }
  try {
    await API('/api/student/change-password', {
      method:'POST',
      body:{ studentId: me.id, currentPassword: current, newPassword: newPwd }
    });
    toast('密码修改成功');
    // 清空表单
    document.getElementById('pwdCurrent').value = '';
    document.getElementById('pwdNew').value = '';
    document.getElementById('pwdNewConfirm').value = '';
  } catch(e) {
    toast(e.message || '修改失败','error');
  }
}

  var btn = document.getElementById('lotteryBtn');
  var resultDiv = document.getElementById('lotteryResult');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.style.opacity = '0.5';
  btn.style.cursor = 'not-allowed';

  // 收集奖品名用于滚动展示
  var allPrizes = (window._lotteryData && window._lotteryData.prizes) || [];
  var prizeNames = allPrizes.map(function(p){ return p.name; });

  // 显示老虎机界面
  var wheel = document.getElementById('lotteryWheel');
  var prizeCard = document.getElementById('prizeListCard');
  if (wheel) wheel.style.display = 'block';
  if (prizeCard) prizeCard.style.display = 'none';
  resultDiv.innerHTML = '';

  // 老虎机滚动文字
  var slotText = document.getElementById('slotText');
  var spinCount = 0;
  var maxSpins = 20;
  var spinInterval = setInterval(function(){
    slotText.textContent = prizeNames[spinCount % prizeNames.length];
    spinCount++;
    if (spinCount >= maxSpins) clearInterval(spinInterval);
  }, 80);

  // 调用抽奖接口
  try {
    var result = await API('/api/lottery/draw', { method:'POST', body:{ studentId: me.id } });

    // 等待滚动结束后再显示结果
    setTimeout(function(){
    me.petPoints = result.studentPetPoints;
    document.getElementById('myPetPointsBadge').innerHTML = '&#x1F43E; ' + me.petPoints;

      if (wheel) wheel.style.display = 'none';
      if (prizeCard) prizeCard.style.display = 'block';

      var isWin = result.won.points > 0;
      var cardBg = isWin ? 'background:linear-gradient(135deg,#fdf2f8,#ede9fe);border:2px solid #f472b6;' : 'background:#f9fafb;border:2px solid #e5e7eb;';
      var emoji = isWin ? '&#x1F389;' : '&#x1F61F;';
      var title = isWin ? '恭喜获得' : '很遗憾';
      var pts = isWin ? '<div style="font-size:.88rem;color:#a78bfa;margin-top:6px;">+' + result.won.points + ' 宠物积分</div>' : '';
      var confettiHTML = isWin ? '<canvas id="lotteryConfetti" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>' : '';

      resultDiv.innerHTML = confettiHTML + '<div id="lotteryResultCard" style="' + cardBg + 'border-radius:16px;padding:24px;text-align:center;animation:lotteryReveal .5s cubic-bezier(.36,.07,.19,.97) both;">';
      resultDiv.innerHTML += '<div style="font-size:2.5rem;margin-bottom:8px;">' + emoji + '</div>';
      resultDiv.innerHTML += '<div style="font-size:1.1rem;font-weight:700;color:#374151;">' + title + '</div>';
      resultDiv.innerHTML += '<div style="font-size:1.6rem;font-weight:800;color:#f472b6;margin:8px 0;">' + result.won.name + '</div>';
      resultDiv.innerHTML += pts + '</div>';
      resultDiv.innerHTML += '<div style="text-align:center;margin-top:16px;"><button onclick="renderLotteryPage()" style="padding:8px 24px;background:linear-gradient(135deg,#f472b6,#a78bfa);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;">再来一次</button></div>';

      if (isWin) spawnLotteryConfetti();
      toast((isWin ? '&#x1F389; ' : '') + result.won.name, isWin ? 'success' : 'info');
    }, maxSpins * 80 + 200);

  } catch(e) {
    clearInterval(spinInterval);
    if (wheel) wheel.style.display = 'none';
    if (prizeCard) prizeCard.style.display = 'block';
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.style.cursor = 'pointer';
    toast('抽奖失败：' + e.message, 'error');
  }
}

function spawnLotteryConfetti() {
  var canvas = document.getElementById('lotteryConfetti');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var particles = [];
  var colors = ['#f472b6','#a78bfa','#fbbf24','#34d399','#60a5fa','#fb7185','#facc15'];
  for (var i=0; i<120; i++) {
    particles.push({
      x: canvas.width / 2 + (Math.random() - .5) * 100,
      y: canvas.height / 2,
      vx: (Math.random() - .5) * 18,
      vy: -(Math.random() * 14 + 6),
      r: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      rotV: (Math.random() - .5) * 10,
      alpha: 1
    });
  }
  var t = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    t++;
    var alive = false;
    for (var i=0; i<particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += .35;
      p.rot += p.rotV;
      p.alpha = Math.max(0, 1 - t / 80);
      if (p.alpha <= 0) continue;
      alive = true;
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * .6);
      ctx.restore();
    }
    if (alive && t < 100) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  animate();
}
