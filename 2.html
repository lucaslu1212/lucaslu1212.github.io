<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生端 - 课堂辅助系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#1565c0;--primary-light:#1e88e5;--primary-dark:#0d47a1;
  --success:#2e7d32;--warning:#f57f17;--danger:#c62828;
  --bg:#f0f4f8;--white:#fff;--text:#212121;--text-light:#757575;
  --border:#e0e0e0;--shadow:0 2px 12px rgba(0,0,0,.08);--radius:10px;
}
body{font-family:'Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ─── 顶栏 ─── */
.topbar{background:var(--primary-dark);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;box-shadow:0 2px 10px rgba(0,0,0,.2);}
.topbar-left{display:flex;align-items:center;gap:16px;}
.topbar h1{font-size:1.05rem;font-weight:700;letter-spacing:1px;}
.topbar-right{display:flex;align-items:center;gap:16px;}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border-radius:20px;padding:5px 14px;font-size:.85rem;}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f57f17,#ffa000);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.88rem;flex-shrink:0;}
.points-badge{background:linear-gradient(135deg,#f57f17,#ffa000);color:#fff;border-radius:20px;padding:3px 12px;font-size:.8rem;font-weight:700;}

/* ─── 主体 ─── */
.layout{display:flex;height:calc(100vh - 60px);}
.sidebar{width:200px;min-width:200px;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;font-size:.9rem;color:var(--text);transition:all .2s;border-left:3px solid transparent;}
.nav-item:hover{background:#f0f4f8;}
.nav-item.active{background:#e3f2fd;color:var(--primary);border-left-color:var(--primary);font-weight:600;}
.nav-item .icon{font-size:1.1rem;}
.content{flex:1;padding:24px;overflow-y:auto;}

/* ─── 登录 ─── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d47a1,#1565c0);}
.login-card{background:#fff;border-radius:20px;padding:40px 48px;width:400px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.login-card h2{font-size:1.6rem;font-weight:700;color:var(--primary-dark);margin-bottom:8px;text-align:center;}
.login-card p{color:#999;text-align:center;margin-bottom:28px;font-size:.9rem;}
  .pwd-wrap{position:relative;}
  .pwd-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:#888;opacity:.75;transition:opacity .2s;}
  .pwd-eye:hover{opacity:1;color:var(--primary);}
  .pwd-eye:focus{outline:none;color:var(--primary);opacity:1;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:.82rem;color:var(--text-light);font-weight:500;margin-bottom:5px;}
.form-control{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;font-family:inherit;outline:none;transition:border .2s;}
.form-control:focus{border-color:var(--primary);}
.btn{padding:10px 24px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-family:inherit;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;width:100%;justify-content:center;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-sm{padding:6px 14px;font-size:.82rem;}
.btn-xs{padding:4px 10px;font-size:.78rem;}
.btn-success{background:var(--success);color:#fff;}
.btn-success:hover{background:#1b5e20;}
.btn-danger{background:var(--danger);color:#fff;}

/* ─── 卡片 ─── */
.card{background:var(--white);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);margin-bottom:16px;}
.card-title{font-size:1rem;font-weight:700;color:var(--primary-dark);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

/* ─── 统计卡 ─── */
.stat-card{border-radius:var(--radius);padding:18px 20px;color:#fff;}
.stat-card.blue{background:linear-gradient(135deg,var(--primary),var(--primary-light));}
.stat-card.green{background:linear-gradient(135deg,#2e7d32,#43a047);}
.stat-card.orange{background:linear-gradient(135deg,#e65100,#f57c00);}
.stat-card .num{font-size:1.8rem;font-weight:700;line-height:1;}
.stat-card .lbl{font-size:.82rem;opacity:.85;margin-top:5px;}

/* ─── 课程列表 ─── */
.course-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px;cursor:pointer;transition:all .2s;background:#fff;}
.course-item:hover{border-color:var(--primary);box-shadow:0 2px 10px rgba(21,101,192,.12);}
.course-item.active{border-color:var(--primary);background:#e3f2fd;}
.course-item .ci-icon{font-size:1.8rem;}
.course-item .ci-info{flex:1;}
.course-item .ci-title{font-weight:600;font-size:.95rem;color:var(--text);}
.course-item .ci-sub{font-size:.78rem;color:var(--text-light);margin-top:3px;}
.new-badge{background:#f44336;color:#fff;border-radius:10px;padding:1px 7px;font-size:.7rem;font-weight:700;margin-left:6px;}

/* ─── 文件列表 ─── */
.file-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;border:1px solid var(--border);margin-bottom:8px;background:#fafbff;}
.file-item:hover{border-color:var(--primary);}
.file-icon{font-size:1.4rem;flex-shrink:0;}
.file-name{font-size:.88rem;font-weight:500;word-break:break-all;line-height:1.4;}
.file-size{font-size:.75rem;color:var(--text-light);margin-top:2px;}
.file-info{flex:1;min-width:0;overflow:hidden;}

/* ─── 作业/题目 ─── */
.hw-card{border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.hw-card.correct{border-color:#43a047;background:#f1f8e9;}
.hw-card.wrong{border-color:#e57373;background:#fff8f8;}
.q-no{display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;border-radius:50%;width:28px;height:28px;font-size:.82rem;font-weight:700;flex-shrink:0;margin-right:10px;}
.q-text{font-size:.95rem;line-height:1.7;font-weight:500;}
.options{margin:12px 0;display:flex;flex-direction:column;gap:8px;}
.option-btn{display:flex;align-items:center;gap:10px;padding:10px 14px;border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;font-size:.9rem;background:#fff;text-align:left;}
.option-btn:hover:not(:disabled){border-color:var(--primary);background:#f0f7ff;}
.option-btn.selected{border-color:var(--primary);background:#e3f2fd;color:var(--primary);font-weight:600;}
.option-btn.correct{border-color:#43a047;background:#e8f5e9;color:#2e7d32;font-weight:600;}
.option-btn.wrong{border-color:#e57373;background:#ffebee;color:#c62828;}
.option-btn:disabled{cursor:default;opacity:.85;}
.tf-btns{display:flex;gap:12px;margin:12px 0;}
.tf-btn{padding:10px 28px;border:2px solid var(--border);border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s;background:#fff;}
.tf-btn:hover:not(:disabled){border-color:var(--primary);}
.tf-btn.selected{border-color:var(--primary);background:#e3f2fd;color:var(--primary);}
.tf-btn.correct{border-color:#43a047;background:#e8f5e9;color:#2e7d32;}
.tf-btn.wrong{border-color:#e57373;background:#ffebee;color:#c62828;}
.tf-btn:disabled{cursor:default;}

/* ─── 打字练习 ─── */
@keyframes blink {0%,100%{border-color:var(--primary);}50%{border-color:transparent;}}

/* ─── 错题本 ─── */
.mistake-card{border:1px solid var(--border);border-radius:10px;background:#fff;transition:all .2s;}
.mistake-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.1);}
.fill-input{width:100%;margin:10px 0;padding:10px 14px;border:2px solid var(--border);border-radius:8px;font-size:.9rem;font-family:inherit;outline:none;transition:border .2s;}
.fill-input:focus{border-color:var(--primary);}
.fill-input:disabled{background:#f5f5f5;cursor:default;}
/* 下拉填空题 */
.selectfill-wrap{line-height:2.4;font-size:.92rem;}
.sf-select{display:inline-block;padding:2px 4px 6px 4px;border:none;border-bottom:2px solid var(--primary);font-size:.9rem;background:transparent;cursor:pointer;min-width:80px;outline:none;vertical-align:middle;transition:border-color .2s;color:var(--primary);-webkit-appearance:none;appearance:none;}
.sf-select:focus{border-bottom-color:#e53935;color:#e53935;background:transparent;}
.sf-select.answered{border-bottom-color:var(--primary);color:var(--primary);background:transparent;}
.sf-select:disabled{cursor:default;opacity:.85;border-bottom-color:#aaa;color:#555;}
.sf-select.correct{border-bottom-color:var(--success);color:var(--success);}
.sf-select.wrong{border-bottom-color:var(--danger);color:var(--danger);}
.result-tip{margin-top:8px;font-size:.82rem;padding:6px 12px;border-radius:6px;}
.result-tip.ok{background:#e8f5e9;color:#2e7d32;}
.result-tip.fail{background:#ffebee;color:#c62828;}

/* ─── 积分列表 ─── */
.points-rank{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;border-bottom:1px solid #f0f0f0;}
.points-rank .rank-no{width:32px;font-weight:700;color:#999;text-align:center;}
.rank-me{background:#fffde7;}

/* ─── 成绩面板 ─── */
.score-big{font-size:4rem;font-weight:700;text-align:center;margin:20px 0;color:var(--primary);}
.score-big.fail{color:var(--danger);}

/* ─── 提交成功 ─── */
.submit-result{text-align:center;padding:32px 20px;}
.submit-result .big-icon{font-size:4rem;margin-bottom:12px;}
.submit-result h2{font-size:1.5rem;font-weight:700;color:var(--primary-dark);margin-bottom:8px;}

/* ─── 空态 ─── */
.empty{text-align:center;padding:40px 20px;color:var(--text-light);}
.empty .icon{font-size:3rem;margin-bottom:10px;}

/* ─── 模态框 ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.show{opacity:1;pointer-events:all;}
.modal{background:#fff;border-radius:14px;padding:28px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;transform:scale(.95);transition:transform .2s;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-overlay.show .modal{transform:scale(1);}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-header h3{font-size:1.1rem;font-weight:700;color:var(--primary-dark);}

/* ─── 预览模态框样式 ─── */
#previewModal .modal{padding:0;}
#previewContent iframe{width:100%;height:100%;border:none;background:#fff;display:block;}
/* 全屏模式 */
#previewBox.fullscreen{width:100vw!important;max-width:100vw!important;height:100vh!important;max-height:100vh!important;border-radius:0!important;}

/* ─── Toast ─── */
#toast{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast-item{background:#333;color:#fff;padding:12px 20px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:slideIn .3s ease;font-size:.88rem;}
.toast-item.success{background:#2e7d32;}
.toast-item.error{background:#c62828;}
@keyframes slideIn{from{transform:translateX(60px);opacity:0;}to{transform:translateX(0);opacity:1;}}

.hidden{display:none!important;}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600;}
.badge-blue{background:#e3f2fd;color:#1565c0;}
.badge-green{background:#e8f5e9;color:#2e7d32;}
.badge-orange{background:#fff3e0;color:#e65100;}
.badge-gray{background:#f5f5f5;color:#757575;}
.badge-red{background:#ffebee;color:#c62828;}
.badge-purple{background:#f3e5f5;color:#6a1b9a;}

/* ─── 连线题 ─── */
.match-lines-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.match-left-item, .match-right-item { position: relative; z-index: 1; }
.match-left-item:hover,.match-right-item:hover{border-color:var(--primary)!important;background:#f0f7ff!important;}
.match-connected{border-color:var(--success)!important;background:#e8f5e9!important;}
.match-used{border-color:var(--success)!important;background:#e8f5e9!important;opacity:0.7;}
.matching-area{position:relative;}

/* ─── 进度 ─── */
.hw-progress{height:6px;background:#e0e0e0;border-radius:3px;margin:8px 0;overflow:hidden;}
.hw-progress-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .4s;}

/* ─── 每日答题 ─── */
.dq-option{display:flex;align-items:center;gap:10px;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;cursor:pointer;margin-bottom:8px;transition:all .2s;background:#fff;}
.dq-option:hover{border-color:var(--primary);background:#f0f7ff;}
.dq-opt-letter{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:.85rem;flex-shrink:0;}

/* 整体场景 */
.pet-scene{perspective:900px;perspective-origin:50% 30%;}
/* 3D旋转展示台 */
.pet-stage-wrap{
  position:relative;width:200px;height:200px;margin:0 auto;
  transform-style:preserve-3d;
  animation:stageSpin 12s linear infinite;
}
.pet-stage-wrap:hover{animation-play-state:paused;}
@keyframes stageSpin{from{transform:rotateY(0deg);}to{transform:rotateY(360deg);}}
/* 展示台底盘 */
.pet-pedestal{
  position:absolute;bottom:-18px;left:50%;transform:translateX(-50%) rotateX(70deg);
  width:120px;height:40px;
  background:conic-gradient(from 0deg,#a78bfa,#60a5fa,#34d399,#f472b6,#a78bfa);
  border-radius:50%;
  box-shadow:0 0 30px rgba(167,139,250,.7),0 0 60px rgba(96,165,250,.4);
  animation:pedesGlow 3s ease-in-out infinite;
}
@keyframes pedesGlow{0%,100%{box-shadow:0 0 30px rgba(167,139,250,.7),0 0 60px rgba(96,165,250,.4);}50%{box-shadow:0 0 50px rgba(167,139,250,1),0 0 90px rgba(96,165,250,.6),0 0 120px rgba(52,211,153,.3);}}
/* 宠物主体 */
.pet-stage-emoji{
  font-size:6rem;line-height:1;display:block;text-align:center;
  position:absolute;top:20px;left:50%;transform:translateX(-50%);
  filter:drop-shadow(0 0 16px rgba(167,139,250,.8)) drop-shadow(0 0 40px rgba(96,165,250,.5));
  transition:filter .6s;
  animation:petFloat 3s ease-in-out infinite;
}
@keyframes petFloat{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-14px);}}
@keyframes petFloatImg{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
/* 光晕光圈 */
.pet-halo{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(167,139,250,.25) 0%,transparent 70%);
  animation:haloBreath 3s ease-in-out infinite;
}
@keyframes haloBreath{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7;}50%{transform:translate(-50%,-50%) scale(1.3);opacity:1;}}
/* 轨道粒子 */
.pet-orbit{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.pet-orbit-dot{
  position:absolute;width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle,#fff,var(--c));
  box-shadow:0 0 8px var(--c),0 0 16px var(--c);
  animation:orbitAnim var(--dur) linear infinite;
  transform-origin:0 0;
}
@keyframes orbitAnim{from{transform:rotate(var(--start)) translateX(var(--r)) scale(1);}50%{transform:rotate(calc(var(--start)+180deg)) translateX(var(--r)) scale(1.5);}to{transform:rotate(calc(var(--start)+360deg)) translateX(var(--r)) scale(1);}}
/* 星空背景 */
.pet-starfield{
  position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  background:radial-gradient(ellipse at 20% 20%,rgba(167,139,250,.15) 0%,transparent 50%),
             radial-gradient(ellipse at 80% 80%,rgba(96,165,250,.15) 0%,transparent 50%),
             linear-gradient(135deg,#0f0c29,#302b63,#24243e);
}
.pet-star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--td) ease-in-out infinite var(--td2);}
@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(1);}50%{opacity:1;transform:scale(1.5);}}
/* 心情条 */
.pet-mood-bar{height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin:4px 0;box-shadow:inset 0 1px 3px rgba(0,0,0,.3);}
.pet-mood-fill{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.34,1.56,.64,1);background:linear-gradient(90deg,#ef5350,#ffa000,#43a047);}
/* 经验条 */
.pet-exp-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin:4px 0;box-shadow:inset 0 1px 3px rgba(0,0,0,.3);}
.pet-exp-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#60a5fa,#34d399);border-radius:4px;transition:width .8s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 8px rgba(96,165,250,.6);}
/* 3D操作按钮 */
.pet-action-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:16px 20px;border:none;border-radius:16px;
  background:linear-gradient(145deg,var(--bg1),var(--bg2));
  color:#fff;cursor:pointer;font-family:inherit;
  transform:translateZ(0);
  box-shadow:0 6px 0 var(--shadow),0 8px 20px rgba(0,0,0,.2);
  transition:transform .15s,box-shadow .15s;
  flex:1;
}
.pet-action-btn:active:not(:disabled){transform:translateY(4px) translateZ(0);box-shadow:0 2px 0 var(--shadow),0 4px 10px rgba(0,0,0,.2);}
.pet-action-btn:hover:not(:disabled){filter:brightness(1.1);}
.pet-action-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.pet-action-btn .pa-icon{font-size:1.8rem;}
.pet-action-btn .pa-label{font-size:.82rem;font-weight:800;letter-spacing:.5px;}
.pet-action-btn .pa-cost{font-size:.75rem;opacity:.85;font-weight:600;}
/* 领养卡 3D翻转 */
.pet-adopt-wrap{perspective:600px;}
.pet-adopt-card{
  border:2px solid transparent;border-radius:16px;padding:20px;cursor:pointer;text-align:center;
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#a78bfa,#60a5fa,#34d399) border-box;
  transform:translateZ(0);
  transition:transform .25s,box-shadow .25s;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}
.pet-adopt-card:hover{transform:translateY(-6px) rotateX(4deg) rotateY(-4deg);box-shadow:0 16px 40px rgba(96,165,250,.25);}
.pet-adopt-card.selected{
  background:linear-gradient(#e8f0fe,#f3e8ff) padding-box,linear-gradient(135deg,#a78bfa,#60a5fa,#34d399) border-box;
  transform:translateY(-6px) scale(1.04);
  box-shadow:0 16px 40px rgba(167,139,250,.35);
}
.pet-adopt-card .pa-big{font-size:3.5rem;display:block;margin-bottom:8px;}
/* 进化闪光 */
@keyframes evolveBlast{
  0%{transform:translateX(-50%) scale(0.5);opacity:0;filter:brightness(3);}
  30%{transform:translateX(-50%) scale(1.6);opacity:1;filter:brightness(2);}
  60%{transform:translateX(-50%) scale(1.1);opacity:1;filter:brightness(1.5);}
  100%{transform:translateX(-50%) scale(1);opacity:1;filter:brightness(1);}
}
.pet-evolve-flash{animation:evolveBlast .8s cubic-bezier(.34,1.56,.64,1) forwards;}
/* 粒子爆炸 */
.pet-particle{position:fixed;pointer-events:none;border-radius:50%;z-index:9999;animation:particleFly var(--pt) ease-out forwards;}
@keyframes particleFly{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--px),var(--py)) scale(0);opacity:0;}}
/* 反弹动画 */
@keyframes petBounce{0%,100%{transform:translateX(-50%) translateY(0);}40%{transform:translateX(-50%) translateY(-20px);}60%{transform:translateX(-50%) translateY(-8px);}}
@keyframes petSpin{0%{filter:drop-shadow(0 0 16px rgba(167,139,250,.8)) drop-shadow(0 0 40px rgba(96,165,250,.5)) hue-rotate(0deg);}100%{filter:drop-shadow(0 0 16px rgba(167,139,250,.8)) drop-shadow(0 0 40px rgba(96,165,250,.5)) hue-rotate(360deg);}}
.pet-bounce{animation:petBounce .5s cubic-bezier(.34,1.56,.64,1) 2 !important;}
.pet-spin{animation:petSpin .6s linear 2 !important;}
.pet-heart{animation:petHeart .4s ease 3 !important;}
/* 抽奖动画 */
@keyframes slotPulse{0%,100%{opacity:.3;transform:scale(.7);}50%{opacity:1;transform:scale(1);}}
@keyframes lotteryReveal{0%{transform:scale(.3) rotate(-10deg);opacity:0;}60%{transform:scale(1.08) rotate(2deg);opacity:1;}100%{transform:scale(1) rotate(0deg);opacity:1;}}
@keyframes petHeart{0%,100%{filter:drop-shadow(0 0 16px rgba(240,98,146,.8));}50%{filter:drop-shadow(0 0 40px rgba(240,98,146,1)) drop-shadow(0 0 80px rgba(240,98,146,.6));}}
/* 进化路径 */
.pet-evo-step{display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .3s;}
.pet-evo-step.active{transform:scale(1.2);}
.pet-evo-step.active .evo-emoji{filter:drop-shadow(0 0 8px rgba(167,139,250,1));}

@media(max-width:700px){
  .sidebar{width:56px;min-width:56px;}
  .nav-item span{display:none;}
  .nav-item{justify-content:center;padding:12px;}
  .grid-2,.grid-3{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- ═══════ 登录界面 ═══════ -->
<div id="loginWrap" class="login-wrap">
  <div class="login-card">
    <h2>👨‍🎓 学生登录</h2>
    <p>输入学号和密码进入课堂</p>
    <div class="form-group">
      <label>学号</label>
      <input class="form-control" id="loginStudentNo" type="text" placeholder="请输入学号" autocomplete="off">
    </div>
    <div class="form-group">
      <label>密码</label>
      <div class="pwd-wrap">
        <input class="form-control" id="loginPassword" type="password" placeholder="请输入密码" autocomplete="off" style="padding-right:40px;">
        <button type="button" class="pwd-eye" onclick="toggleLoginPassword(this)" title="显示/隐藏密码" aria-label="显示或隐藏密码">
          <span class="eye-open">👁</span>
          <span class="eye-closed" style="display:none;">🙈</span>
        </button>
      </div>
    </div>
    <div id="loginError" style="color:var(--danger);font-size:.82rem;margin-bottom:12px;display:none;">学号或密码错误，请联系老师</div>
    <button class="btn btn-primary" onclick="doLogin()" style="margin-top:4px;">🚀 进入课堂</button>
    <p style="margin-top:16px;text-align:center;font-size:.78rem;color:#bbb;">确保已连接到学校局域网</p>
  </div>
</div>

<!-- ═══════ 主界面 ═══════ -->
<div id="mainWrap" class="hidden">
  <div class="topbar">
    <div class="topbar-left">
      <h1>📚 课堂辅助系统</h1>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="avatar" id="avatarText">-</div>
        <span id="userNameDisplay">-</span>
        <span id="userClassDisplay" style="opacity:.7;font-size:.78rem;"></span>
      </div>
      <span class="points-badge" id="myPointsBadge" title="排名积分">⭐ 0</span>
      <span class="points-badge" id="myPetPointsBadge" title="宠物积分" style="background:linear-gradient(135deg,#a78bfa,#f472b6);margin-left:4px;">🐾 0</span>
      <button class="btn btn-sm btn-outline" style="color:#fff;border-color:rgba(255,255,255,.4);" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="layout">
    <!-- 侧边栏 -->
    <nav class="sidebar">
      <div class="nav-item active" onclick="showPage('home')" id="snav-home"><span class="icon">🏠</span><span>首页</span></div>
      <div class="nav-item" onclick="showPage('courses')" id="snav-courses"><span class="icon">📖</span><span>课程学习</span></div>
      <div class="nav-item" onclick="showPage('homework')" id="snav-homework"><span class="icon">📝</span><span>课前预习</span></div>
      <div class="nav-item" onclick="showPage('dailyquiz')" id="snav-dailyquiz"><span class="icon">🎯</span><span>每日答题</span></div>
      <div class="nav-item" onclick="showPage('battle')" id="snav-battle"><span class="icon">🔥</span><span>一站到底</span></div>
      <div class="nav-item" onclick="showPage('classwork')" id="snav-classwork"><span class="icon">📝</span><span>课堂作业</span></div>
            <div class="nav-item" onclick="showPage('typing')" id="snav-typing"><span class="icon">⌨️</span><span>打字练习</span></div>
      <div class="nav-item" onclick="showPage('mistakes')" id="snav-mistakes"><span class="icon">📕</span><span>错题本</span></div>
      <div class="nav-item" onclick="showPage('points')" id="snav-points"><span class="icon">⭐</span><span>我的积分</span></div>
      <div class="nav-item" onclick="showPage('pet')" id="snav-pet"><span class="icon">🐾</span><span>我的宠物</span></div>
      <div class="nav-item" onclick="showPage('lottery')" id="snav-lottery"><span class="icon">🎰</span><span>幸运抽奖</span></div>
      <div class="nav-item" onclick="showPage('experience')" id="snav-experience"><span class="icon">🎮</span><span>体验区</span></div>
      <div class="nav-item" onclick="showPage('dragexercise')" id="snav-dragexercise"><span class="icon">🧩</span><span>拖拽题</span></div>
      <div class="nav-item" onclick="showPage('password')" id="snav-password"><span class="icon">🔑</span><span>修改密码</span></div>
    </nav>
    <!-- 内容区 -->
    <div class="content" id="mainContent"></div>
  </div>
</div>

<!-- ─── Toast ─── -->
<div id="toast"></div>

<!-- ─── 文件预览模态框 ─── -->
<div id="previewModal" class="modal-overlay" onclick="if(event.target===this)closePreview()">
  <div id="previewBox" class="modal" style="width:90vw;max-width:1200px;height:85vh;max-height:85vh;padding:0;display:flex;flex-direction:column;">
    <div style="padding:10px 16px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;background:#f5f5f5;flex-shrink:0;">
      <h3 id="previewTitle" style="font-size:.95rem;font-weight:700;color:var(--primary-dark);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;"></h3>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <a id="previewDownloadBtn" href="#" download class="btn btn-sm btn-outline" style="font-size:.78rem;">📥 下载</a>
        <button class="btn btn-sm btn-outline" onclick="togglePreviewFullscreen()" id="fullscreenBtn" style="font-size:.78rem;">⛶ 全屏</button>
        <button class="btn btn-sm btn-outline" onclick="closePreview()" style="font-size:.78rem;">✕ 关闭</button>
      </div>
    </div>
    <div id="previewContent" style="flex:1;overflow:hidden;background:#f0f0f0;position:relative;"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  状态
// ═══════════════════════════════════════════════
let me = null; // 当前学生
let state = {
  settings: {},
  students: [],
  courses: [],
  assignments: [],
  submissions: [],
  questions: [],
  typingArticles: [],
  currentPage: 'home',
  homeworkAnswers: {},
  hwSubmitted: false,
  questionOrder: {},    // assignmentId -> 打乱后的题目id数组
  optionShuffle: {}     // qId -> {displayLetter: originalLetter} 选项乱序映射
};


const API = (path, opts = {}) => {
  const { body, ...rest } = opts;
  const fetchOpts = {
    method: rest.method || 'GET',
    credentials: 'same-origin',
    ...rest,
    headers: { 'Content-Type': 'application/json', ...(rest.headers || {}) }
  };
  if (body !== undefined) {
    fetchOpts.body = typeof body === 'string' ? body : JSON.stringify(body);
  }
  return fetch(path, fetchOpts).then(async r => {
    const j = await r.json();
    if (!r.ok) throw Object.assign(new Error(j.error || '请求失败'), j);
    return j;
  });
};

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast-item ${type}`;
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}

function fmtDate(ts) {
  return new Date(ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function fmtSize(bytes) {
  if (bytes<1024) return bytes+'B';
  if (bytes<1048576) return (bytes/1024).toFixed(1)+'KB';
  return (bytes/1048576).toFixed(1)+'MB';
}
function fileIcon(mime='') {
  if (mime.includes('pdf')) return '📕';
  if (mime.includes('word')||mime.includes('doc')) return '📘';
  if (mime.includes('presentation')||mime.includes('ppt')) return '📊';
  if (mime.includes('video')) return '🎬';
  if (mime.includes('image')) return '🖼️';
  return '📎';
}

// 根据文件类型返回预览按钮
function getPreviewButton(file) {
  const isPdf = file.mimetype && file.mimetype.includes('pdf');
  const isDoc = file.mimetype && (file.mimetype.includes('word') || file.mimetype.includes('doc'));
  const isPpt = file.mimetype && (file.mimetype.includes('presentation') || file.mimetype.includes('ppt'));
  const isImg = file.mimetype && file.mimetype.includes('image');
  const isVideo = file.mimetype && file.mimetype.includes('video');

  // 从 URL 中提取文件名（用于后端预览 API）
  const filename = file.url ? file.url.split('/').pop() : '';

  if (isPdf) {
    return `<button class="btn btn-primary btn-sm" onclick="previewFile('${file.url}','${file.originalName}','pdf','')">👁️ 预览</button>`;
  } else if (isDoc) {
    return `<button class="btn btn-primary btn-sm" onclick="previewFile('${file.url}','${file.originalName}','docx','${filename}')">👁️ 预览</button>`;
  } else if (isPpt) {
    return `<button class="btn btn-primary btn-sm" onclick="previewFile('${file.url}','${file.originalName}','ppt','${filename}')">👁️ 预览</button>`;
  } else if (isImg) {
    return `<button class="btn btn-primary btn-sm" onclick="previewFile('${file.url}','${file.originalName}','image','')">👁️ 预览</button>`;
  } else {
    return `<a href="${file.url}" download class="btn btn-primary btn-sm">📥 下载</a>`;
  }
}

// 打开文件预览模态框
function previewFile(url, filename, type, serverFilename) {
  const modal = document.getElementById('previewModal');
  const content = document.getElementById('previewContent');
  const title = document.getElementById('previewTitle');
  const downloadBtn = document.getElementById('previewDownloadBtn');
  const box = document.getElementById('previewBox');

  // 退出全屏状态
  box.classList.remove('fullscreen');
  document.getElementById('fullscreenBtn').textContent = '⛶ 全屏';

  title.textContent = filename;
  downloadBtn.href = url;
  downloadBtn.download = filename;

  // 重置 content 样式
  content.style.display = '';

  let previewHtml = '';

  if (type === 'pdf') {
    // PDF：浏览器原生支持，局域网直接预览
    previewHtml = `<iframe src="${url}" style="width:100%;height:100%;border:none;background:#fff;display:block;"></iframe>`;

  } else if (type === 'docx') {
    // DOCX：服务端用 mammoth 转换成 HTML 后展示
    previewHtml = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f9f9f9;">
      <div style="text-align:center;color:#888;font-size:.9rem;">⏳ 正在加载文档…</div>
    </div>`;
    content.innerHTML = previewHtml;
    modal.classList.add('show');
    // 异步加载转换结果
    fetch(`/api/preview/docx?file=${encodeURIComponent(serverFilename)}`)
      .then(r => r.text())
      .then(html => {
        const blob = new Blob([html], {type:'text/html;charset=utf-8'});
        const blobUrl = URL.createObjectURL(blob);
        content.innerHTML = `<iframe src="${blobUrl}" style="width:100%;height:100%;border:none;background:#fff;display:block;"></iframe>`;
      })
      .catch(() => {
        content.innerHTML = `<div style="padding:40px;text-align:center;color:var(--danger);">
          <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
          <div>文档解析失败，请直接下载查看</div>
        </div>`;
      });
    return;

  } else if (type === 'ppt') {
    // PPT：暂不支持在线预览，给友好提示
    previewHtml = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f9f9f9;">
      <div style="text-align:center;padding:40px;">
        <div style="font-size:4rem;margin-bottom:16px;">📊</div>
        <div style="font-size:1.1rem;font-weight:700;color:#444;margin-bottom:8px;">${filename}</div>
        <div style="color:#888;font-size:.9rem;margin-bottom:24px;">PPT 文件需下载后用 PowerPoint 或 WPS 打开</div>
        <a href="${url}" download="${filename}" class="btn btn-primary" style="text-decoration:none;">📥 立即下载</a>
      </div>
    </div>`;

  } else if (type === 'image') {
    // 图片：直接展示
    previewHtml = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1a1a1a;overflow:auto;">
      <img src="${url}" style="max-width:100%;max-height:100%;object-fit:contain;" alt="${filename}">
    </div>`;
  }

  content.innerHTML = previewHtml;
  modal.classList.add('show');
}

// 全屏切换
function togglePreviewFullscreen() {
  const box = document.getElementById('previewBox');
  const btn = document.getElementById('fullscreenBtn');
  if (box.classList.contains('fullscreen')) {
    box.classList.remove('fullscreen');
    btn.textContent = '⛶ 全屏';
  } else {
    box.classList.add('fullscreen');
    btn.textContent = '⊡ 退出全屏';
  }
}

// 关闭预览模态框
function closePreview() {
  const modal = document.getElementById('previewModal');
  const content = document.getElementById('previewContent');
  const box = document.getElementById('previewBox');
  modal.classList.remove('show');
  box.classList.remove('fullscreen');
  document.getElementById('fullscreenBtn').textContent = '⛶ 全屏';
  // 延迟清空，等关闭动画完成后再停止 iframe 加载
  setTimeout(() => { content.innerHTML = ''; }, 200);
}

// ═══════════════════════════════════════════════
//  登录流程（学号 + 密码）
// ═══════════════════════════════════════════════
async function initLogin() {
  // 登录页不需要预先加载数据，按回车也能登录
  document.getElementById('loginStudentNo').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginPassword').focus(); });
  document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

// 切换登录密码显示/隐藏
function toggleLoginPassword(btn) {
  const input = document.getElementById('loginPassword');
  const open = btn.querySelector('.eye-open');
  const closed = btn.querySelector('.eye-closed');
  if (!input || !open || !closed) return;
  if (input.type === 'password') {
    input.type = 'text';
    open.style.display = 'none';
    closed.style.display = '';
    btn.title = '隐藏密码';
    btn.setAttribute('aria-label', '隐藏密码');
  } else {
    input.type = 'password';
    open.style.display = '';
    closed.style.display = 'none';
    btn.title = '显示密码';
    btn.setAttribute('aria-label', '显示密码');
  }
}

async function doLogin() {
  const studentNo = document.getElementById('loginStudentNo').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  document.getElementById('loginError').style.display = 'none';

  if (!studentNo) { toast('请输入学号','error'); return; }
  if (!password) { toast('请输入密码','error'); return; }

  // 调用后端验证接口
  try {
    const result = await API('/api/login', { method:'POST', body:{ studentNo, password, source:'homework' } });
    if (result.error) {
      toast(result.error === '账号或密码错误' ? '学号或密码错误' : result.error, 'error');
      return;
    }
    me = result;
    localStorage.setItem('studentId', me.id);
    localStorage.setItem('studentInfo', JSON.stringify(me));
    await enterMain();
    startHeartbeat(); // 启动心跳
  } catch(e) {
    document.getElementById('loginError').style.display = '';
    if (e.timeout) toast('网络超时，请检查网络', 'error');
    else if (e.message) toast('登录失败: ' + e.message, 'error');
  }
}

async function enterMain() {
  const studentId = me ? me.id : localStorage.getItem('studentId');
  if (!studentId) return;
  if (!me) {
    // 尝试从 localStorage 恢复
    const savedInfo = localStorage.getItem('studentInfo');
    if (savedInfo) {
      try { me = JSON.parse(savedInfo); } catch(e) {}
    }
    if (!me || me.id !== studentId) {
      // localStorage 里没学生信息，重新拉取
      state.settings = await API('/api/settings');
      state.students = await API('/api/students/public');
      me = state.students.find(s=>s.id===studentId);
      if (!me) {
        localStorage.removeItem('studentId');
        localStorage.removeItem('studentInfo');
        return;
      }
      localStorage.setItem('studentInfo', JSON.stringify(me));
    }
  }
  if (!state.settings || !state.settings.grades) {
    state.settings = await API('/api/settings');
  }
  document.getElementById('loginWrap').classList.add('hidden');
  document.getElementById('mainWrap').classList.remove('hidden');
  startHeartbeat();
  document.getElementById('avatarText').textContent = me.name[0];
  document.getElementById('userNameDisplay').textContent = me.name;
  document.getElementById('userClassDisplay').textContent = `${me.grade}${me.className}`;
  document.getElementById('myPointsBadge').textContent = `⭐ ${me.points||0}`;
  document.getElementById('myPetPointsBadge').textContent = `🐾 ${me.petPoints||0}`;
  await loadAllData();
  showPage('home');
}

function logout() {
  const sid = localStorage.getItem('studentId');
  // 通知服务端离线
  if (sid) API('/api/student/logout', { method:'POST', body:{ studentId: sid } });
  localStorage.removeItem('studentId');
  localStorage.removeItem('studentInfo');
  me = null;
  stopHeartbeat();
  document.getElementById('loginWrap').classList.remove('hidden');
  document.getElementById('mainWrap').classList.add('hidden');
}

// ─── 在线状态心跳 ───
let heartbeatTimer = null;
function startHeartbeat() {
  stopHeartbeat();
  const send = () => {
    const sid = sessionStorage.getItem('studentId') || (me && me.id);
    if (sid) API('/api/student/heartbeat', { method:'POST', body:{ studentId: sid } });
  };
  send(); // 立即发送一次
  heartbeatTimer = setInterval(send, 30000); // 每30秒发送
}
function stopHeartbeat() {
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
}
// 页面重新可见时重新发送心跳
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && sessionStorage.getItem('studentId')) {
    const sid = sessionStorage.getItem('studentId') || (me && me.id);
    if (sid) API('/api/student/heartbeat', { method:'POST', body:{ studentId: sid } });
  }
});

async function loadAllData() {
  [state.courses, state.assignments, state.submissions, state.questions, state.typingArticles, state.settings] = await Promise.all([
    API('/api/courses'),
    API('/api/assignments'),
    API(`/api/submissions?studentId=${me.id}`),
    API('/api/questions'),
    API('/api/typing-articles'),
    API('/api/settings')
  ]);
  // 刷新积分
  const freshStudents = await API('/api/students/public');
  const fresh = freshStudents.find(s=>s.id===me.id);
  if (fresh) { me = fresh; document.getElementById('myPointsBadge').textContent = `⭐ ${me.points||0}`; document.getElementById('myPetPointsBadge').textContent = `🐾 ${me.petPoints||0}`; }
}

// ═══════════════════════════════════════════════
//  首页
// ═══════════════════════════════════════════════
function renderHome() {
  // ─── 作业完成情况：课堂作业 + 课前预习 全部计入 ───
  // 口径与教师端「上网放行」一致：后转入学生豁免入班前(createdAt)下发的旧作业
  const myAssignments = state.assignments.filter(a =>
    a.grade === me.grade && a.className === me.className &&
    (a.questions || []).length > 0 &&
    !(me.createdAt && a.assignedAt && a.assignedAt < me.createdAt)
  );
  // 每份作业只取本人最新一次提交（重做后以最后一次为准）
  const latestSub = {};
  (state.submissions || []).forEach(s => {
    if (s.studentId !== me.id) return;
    if (!latestSub[s.assignmentId] || (s.submittedAt || 0) > (latestSub[s.assignmentId].submittedAt || 0)) {
      latestSub[s.assignmentId] = s;
    }
  });
  const items = myAssignments.map(a => {
    const sub = latestSub[a.id];
    const status = sub ? (sub.passed ? 'passed' : 'failed') : 'missing';
    const c = state.courses.find(x => x.id === a.courseId);
    return {
      a, sub, status,
      name: a.type === 'classwork' ? (a.title || '课堂作业') : (c ? c.name : '课前预习'),
      isClasswork: a.type === 'classwork'
    };
  });
  const total = items.length;
  const doneCount = items.filter(x => x.status === 'passed').length;
  // 未完成 = 未交(missing) + 未达标(failed)；时间倒序，最新的排最前
  const undone = items.filter(x => x.status !== 'passed')
    .sort((x, y) => (y.a.assignedAt || 0) - (x.a.assignedAt || 0));
  const missingCount = undone.filter(x => x.status === 'missing').length;
  const failedCount = undone.filter(x => x.status === 'failed').length;
  const rate = total ? Math.round(doneCount / total * 100) : 0;

  const undoneHtml = undone.map(it => {
    const a = it.a;
    const minRate = a.minPassRate !== undefined ? a.minPassRate : 60;
    const typeBadge = it.isClasswork
      ? '<span class="badge badge-blue" style="font-size:.68rem;margin-left:6px;">课堂作业</span>'
      : '<span class="badge badge-purple" style="font-size:.68rem;margin-left:6px;">课前预习</span>';
    const stateBadge = it.status === 'missing'
      ? '<span class="badge badge-red" style="font-size:.68rem;margin-left:4px;">未交</span>'
      : '<span class="badge badge-orange" style="font-size:.68rem;margin-left:4px;">未达标</span>';
    const subInfo = it.status === 'failed'
      ? `已作答，得分率 ${it.sub.score}%（需 ≥${minRate}%）`
      : '还没提交';
    const openFn = it.isClasswork ? `openClasswork('${a.id}')` : `openAssignment('${a.id}')`;
    const btnText = it.status === 'failed' ? '重新作答 →' : '去完成 →';
    return `<div class="course-item" onclick="${openFn}">
      <span class="ci-icon">${it.status === 'failed' ? '⚠️' : '📝'}</span>
      <div class="ci-info">
        <div class="ci-title">${escHtmlStu(it.name)}${typeBadge}${stateBadge}</div>
        <div class="ci-sub">下发于 ${fmtDate(a.assignedAt)} · ${subInfo}</div>
      </div>
      <button class="btn btn-primary btn-sm">${btnText}</button>
    </div>`;
  }).join('');

  let bodyHtml;
  if (total === 0) {
    bodyHtml = '<div class="empty"><div class="icon">📝</div><p>老师还没有下发作业，请等待通知</p></div>';
  } else {
    bodyHtml = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
        <div style="flex:1;height:10px;background:#eee;border-radius:6px;overflow:hidden;">
          <div style="height:100%;width:${rate}%;background:linear-gradient(90deg,#66bb6a,#43a047);border-radius:6px;transition:width .4s;"></div>
        </div>
        <div style="font-size:.85rem;color:#666;white-space:nowrap;">完成 ${doneCount}/${total}（${rate}%）</div>
      </div>
      <div style="font-size:.85rem;color:#666;margin-bottom:14px;">
        应完成 <b>${total}</b> 份 · 已完成 <b style="color:#2e7d32;">${doneCount}</b> 份 · 未完成 <b style="color:#e65100;">${undone.length}</b> 份${undone.length ? `（未交 ${missingCount} · 未达标 ${failedCount}）` : ''}
      </div>
      ${undone.length
        ? undoneHtml
        : '<div style="text-align:center;color:#2e7d32;font-weight:600;padding:10px 0;">🎉 太棒了，所有作业都已完成！</div>'}`;
  }

  return `<div>
    <div style="margin-bottom:24px;">
      <h2 style="font-size:1.4rem;font-weight:700;color:var(--primary-dark);">👋 你好，${escHtmlStu(me.name)}！</h2>
      <p style="color:#888;margin-top:4px;font-size:.9rem;">${me.grade} ${me.className} · 今天也要加油哦</p>
    </div>
    <div class="grid-3" style="margin-bottom:20px;">
      <div class="stat-card blue"><div class="num">⭐ ${me.points||0}</div><div class="lbl">排名积分</div></div>
      <div class="stat-card green"><div class="num">${doneCount}</div><div class="lbl">已完成作业</div></div>
      <div class="stat-card orange"><div class="num">${undone.length}</div><div class="lbl">未完成作业</div></div>
    </div>
    <div class="card">
      <div class="card-title">📋 作业完成情况</div>
      ${bodyHtml}
    </div>
    ${(state.settings.studentInstructions || '').trim() ? `<div class="card">
      <div class="card-title">📖 课堂辅助系统说明</div>
      <div style="font-size:.88rem;line-height:1.8;color:#555;white-space:pre-wrap;">${state.settings.studentInstructions}</div>
    </div>` : ''}
    <div class="card">
      <div class="card-title">📚 可学习的课程</div>
      ${renderCourseItems(3)}
    </div>
  </div>`;
}

function renderCourses() {
  return `<div>
    <div class="card-title" style="font-size:1.2rem;margin-bottom:16px;">📚 我的课程</div>
    ${renderCourseItems()}
  </div>`;
}

function renderCourseItems(limit=999) {
  // 找当前班级有效的 assignment 对应的课程
  const myAssignments = state.assignments.filter(a=>a.grade===me.grade && a.className===me.className);
  const myCourseIds = new Set(myAssignments.map(a=>a.courseId));
  const passedIds = new Set(state.submissions.filter(s=>s.passed).map(s=>s.assignmentId));
  const failedIds = new Set(state.submissions.filter(s=>!s.passed).map(s=>s.assignmentId));

  // 可学习：老师已下发 或 有文件的课（按创建时间倒序，最新在最前）
  let courses = state.courses.filter(c=>myCourseIds.has(c.id) || (c.files||[]).length>0);
  if (!courses.length) return '<div class="empty"><div class="icon">📖</div><p>老师还没有下发课程，请等待通知</p></div>';
  courses = courses.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  return courses.slice(0,limit).map(c=>{
    const assignment = myAssignments.find(a=>a.courseId===c.id && a.active);
    const hasDone = assignment && passedIds.has(assignment.id);
    const hasFailed = assignment && !hasDone && failedIds.has(assignment.id);
    const hasPending = assignment && !hasDone && !hasFailed && (assignment.questions||[]).length > 0;
    return `<div class="course-item" onclick="openCourse('${c.id}')">
      <span class="ci-icon">📗</span>
      <div class="ci-info">
        <div class="ci-title">${c.name}
          ${hasPending?'<span class="new-badge">有作业</span>':''}
          ${hasFailed?'<span class="new-badge" style="background:#ff9800;">未达标</span>':''}
          ${hasDone?'<span class="badge badge-green" style="margin-left:6px;font-size:.7rem;">✓ 已完成</span>':''}
        </div>
        <div class="ci-sub">${c.grade||''} / ${c.chapter||''} / ${c.section||''} · ${(c.files||[]).length} 个文件</div>
      </div>
      <span style="color:#bbb;font-size:1.2rem;">›</span>
    </div>`;
  }).join('');
}

function openCourse(courseId) {
  const c = state.courses.find(x=>x.id===courseId);
  if (!c) return;
  const assignment = state.assignments.find(a=>a.courseId===courseId && a.grade===me.grade && a.className===me.className && a.active);
  // 取最新提交
  const subRecord = assignment && state.submissions.filter(s=>s.assignmentId===assignment.id).sort((a,b)=>b.submittedAt-a.submittedAt)[0];
  const hasDone = subRecord && subRecord.passed;      // 真正完成
  const hasFailed = subRecord && !subRecord.passed;   // 提交了但未达标
  const minRate = assignment ? (assignment.minPassRate !== undefined ? assignment.minPassRate : 60) : 60;

  document.getElementById('mainContent').innerHTML = `
    <div>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <button class="btn btn-outline btn-sm" onclick="showPage('courses')">← 返回</button>
        <div>
          <div style="font-size:.78rem;color:#999;">${c.grade||''} / ${c.chapter||''} / ${c.section||''}</div>
          <h2 style="font-size:1.3rem;font-weight:700;color:var(--primary-dark);">${c.name}</h2>
        </div>
      </div>
      ${c.description?`<div class="card" style="color:#555;font-size:.9rem;">${c.description}</div>`:''}
      <div class="card">
        <div class="card-title">📎 课程资料</div>
        ${!(c.files||[]).length?'<div class="empty"><div class="icon">📂</div><p>暂无资料</p></div>':
          c.files.map(f=>`<div class="file-item">
            <span class="file-icon">${fileIcon(f.mimetype)}</span>
            <div class="file-info">
              <div class="file-name">${f.originalName||'未知文件'}</div>
              <div class="file-size">${fmtSize(f.size||0)}</div>
            </div>
            <div style="flex-shrink:0;">${getPreviewButton(f)}</div>
          </div>`).join('')}
      </div>
      ${assignment && (assignment.questions||[]).length > 0 ?`
      <div class="card">
        <div class="card-title">📝 课堂练习</div>
        ${hasDone?
          `<div style="display:flex;align-items:center;gap:12px;padding:12px;background:#e8f5e9;border-radius:8px;">
            <span style="font-size:1.5rem;">✅</span>
            <div><div style="font-weight:600;color:#2e7d32;">已完成（达标）</div>
            <div style="font-size:.82rem;color:#555;">得分：${subRecord.score}分 | 正确 ${subRecord.correctQ}/${subRecord.totalQ} 题 | 最低得分率：${minRate}%</div></div>
            <button class="btn btn-outline btn-sm" onclick="openAssignment('${assignment.id}',true)">查看详情</button>
          </div>`:
          hasFailed?
          `<div style="display:flex;align-items:center;gap:12px;padding:12px;background:#fff3e0;border-radius:8px;margin-bottom:10px;">
            <span style="font-size:1.5rem;">⚠️</span>
            <div><div style="font-weight:600;color:#e65100;">未达标（需重新作答）</div>
            <div style="font-size:.82rem;color:#555;">本次得分：${subRecord.score}分 | 最低得分率：${minRate}% | 正确 ${subRecord.correctQ}/${subRecord.totalQ} 题</div></div>
            <button class="btn btn-outline btn-sm" onclick="openAssignment('${assignment.id}',true)">查看详情</button>
          </div>
          <button class="btn btn-primary" onclick="openAssignment('${assignment.id}')">🔄 重新作答（${(assignment.questions||[]).length}题）</button>`:
          `<button class="btn btn-primary" onclick="openAssignment('${assignment.id}')">📝 开始作业（${(assignment.questions||[]).length}题）</button>`}
      </div>`:''}
    </div>`;
}

// ═══════════════════════════════════════════════
//  作业列表
// ═══════════════════════════════════════════════
function renderHomeworkList() {
  // 过滤：属于本班级 且 题目数 > 0 且 不是课堂作业（课堂作业走单独的"课堂作业"页面）
  const myAssignments = state.assignments.filter(a=>
    a.grade===me.grade && a.className===me.className && (a.questions||[]).length > 0 && a.type !== 'classwork'
  );
  // 取每个作业的最新提交
  const latestSubMap = {};
  state.submissions.forEach(s=>{
    if (!latestSubMap[s.assignmentId] || s.submittedAt > latestSubMap[s.assignmentId].submittedAt) {
      latestSubMap[s.assignmentId] = s;
    }
  });

  if (!myAssignments.length) return '<div class="empty"><div class="icon">📝</div><p>老师还没有下发作业</p></div>';

  return `<div>
    <div class="card-title" style="font-size:1.2rem;margin-bottom:16px;">📋 课前预习</div>
    ${myAssignments.sort((a,b)=>b.assignedAt-a.assignedAt).map(a=>{
      const c = state.courses.find(x=>x.id===a.courseId);
      const sub = latestSubMap[a.id];
      const passed = sub && sub.passed;
      const failed = sub && !sub.passed;
      const minRate = a.minPassRate !== undefined ? a.minPassRate : 60;
      return `<div class="card" style="display:flex;align-items:center;gap:16px;cursor:pointer;" onclick="openAssignment('${a.id}',${passed})">
        <span style="font-size:1.8rem;">${passed?'✅':failed?'⚠️':'📝'}</span>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:.95rem;">${c?c.name:'未知课程'}</div>
          <div style="font-size:.78rem;color:#888;margin-top:3px;">下发时间：${fmtDate(a.assignedAt)} · ${(a.questions||[]).length} 道题 · 最低得分率：${minRate}%</div>
          ${sub?`<div style="font-size:.82rem;margin-top:4px;color:${passed?'var(--success)':'var(--danger)'};">得分：${sub.score}分 | 正确 ${sub.correctQ}/${sub.totalQ}${failed?' · 未达标，可重新作答':''}</div>`:''}
        </div>
        <span class="badge ${passed?'badge-green':failed?'badge-red':'badge-orange'}">${passed?'已完成':failed?'未达标':'待完成'}</span>
        <span style="color:#bbb;">›</span>
      </div>`;
    }).join('')}
  </div>`;
}

// ═══════════════════════════════════════════════
//  作业答题页
// ═══════════════════════════════════════════════
function openAssignment(assignmentId, reviewMode=false) {
  const assignment = state.assignments.find(a=>a.id===assignmentId);
  if (!assignment) return;
  // 取最新提交
  const existing = state.submissions.filter(s=>s.assignmentId===assignmentId && s.studentId===me.id)
    .sort((a,b)=>b.submittedAt-a.submittedAt)[0];
  // 只有 passed=true 时才强制进入查看模式；未达标可重新作答
  if (existing && existing.passed && !reviewMode) reviewMode = true;

  let qs = (assignment.questions||[]).map(qId=>state.questions.find(q=>q.id===qId)).filter(Boolean);
  if (!qs.length && !reviewMode) {
    toast('此作业暂无题目','error'); return;
  }
  state.homeworkAnswers = {};
  state.hwSubmitted = reviewMode;

  if (!reviewMode) {
    // 题目随机排序（每次重新进入作业时重新打乱）
    const shuffledQs = [...qs];
    for (let i = shuffledQs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledQs[i], shuffledQs[j]] = [shuffledQs[j], shuffledQs[i]];
    }
    qs = shuffledQs;
    state.questionOrder[assignmentId] = qs.map(q=>q.id);

    // 为每道选择题生成选项乱序映射
    state.optionShuffle = {};
    qs.forEach(q => {
      if (q.type === 'choice') {
        const origLetters = ['A','B','C','D'].filter(o=>q['option'+o]);
        const shuffled = [...origLetters];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        // displayLetter -> originalLetter（显示位置A/B/C/D 对应的原始选项字母）
        const map = {};
        origLetters.forEach((displayLetter, idx) => {
          map[displayLetter] = shuffled[idx];
        });
        state.optionShuffle[q.id] = map;
      }
    });
  } else {
    // 查看模式：保持题目原始顺序，不打乱选项
    state.optionShuffle = {};
  }

  document.getElementById('mainContent').innerHTML = renderHomeworkPage(assignment, qs, existing, reviewMode);
  // 初始渲染后绘制所有连线题的 SVG 连线
  setTimeout(() => {
    document.querySelectorAll('.matching-area[id^="matching_"]').forEach(el => {
      const qId = el.id.replace('matching_','');
      if (qId) drawMatchingLines(qId);
    });
  }, 50);
}

function renderHomeworkPage(assignment, qs, existing, reviewMode) {
  const course = state.courses.find(c=>c.id===assignment.courseId);
  const detailMap = {};
  if (existing && existing.scoreDetail) {
    existing.scoreDetail.forEach(d=>{ detailMap[d.questionId]=d; });
  }

  return `<div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
      <button class="btn btn-outline btn-sm" onclick="showPage('homework')">← 返回</button>
      <div>
        <div style="font-size:.78rem;color:#999;">${course?course.name:''}</div>
        <h2 style="font-size:1.3rem;font-weight:700;color:var(--primary-dark);">
          ${reviewMode?'📊 作业结果':'📝 课堂作业'}
        </h2>
      </div>
      ${reviewMode&&existing?`<div style="margin-left:auto;text-align:right;">
        <div style="font-size:1.1rem;font-weight:700;color:${existing.passed?'var(--success)':'var(--danger)'};">
          ${existing.score}分 (${existing.correctQ}/${existing.totalQ})
        </div>
        <div style="font-size:.78rem;margin-top:2px;color:${existing.passed?'var(--success)':'var(--danger)'};">
          ${existing.passed?'✅ 已达标':'⚠️ 未达标（最低 '+( assignment.minPassRate!==undefined?assignment.minPassRate:60)+'%）'}
        </div>
      </div>`:''}
      ${!reviewMode?`<div style="margin-left:auto;font-size:.82rem;color:#888;">最低得分率：${assignment.minPassRate!==undefined?assignment.minPassRate:60}%</div>`:''}
    </div>
    ${qs.map((q,i)=>{
      const detail = detailMap[q.id];
      const answered = reviewMode && detail;
      const userAns = answered ? detail.answer : '';
      const isCorrect = answered ? detail.correct : null;

      let optionsHtml = '';
      if (q.type==='choice') {
        // 获取选项乱序映射（查看模式下无映射，使用原始顺序）
        const shuffle = state.optionShuffle[q.id] || null;
        // displayLetters: 显示用的字母列表（A/B/C/D）
        const displayLetters = ['A','B','C','D'].filter(o=>q['option'+o]);
        optionsHtml = `<div class="options">
          ${displayLetters.map(displayLetter=>{
            // origLetter: 该显示位置对应的原始选项字母
            const origLetter = shuffle ? shuffle[displayLetter] : displayLetter;
            let cls = '';
            if (answered) {
              if (assignment.type==='classwork' && origLetter === q.answer) cls = 'correct';
              else if (origLetter === userAns && !isCorrect) cls = 'wrong';
            } else if (state.homeworkAnswers[q.id] === displayLetter) cls = 'selected';
            return `<button class="option-btn ${cls}" onclick="${answered?'':'selectAnswer(\''+q.id+'\',\''+displayLetter+'\')'}" ${answered?'disabled':''}>
              <span style="font-weight:700;min-width:20px;">${displayLetter}.</span><span>${q['option'+origLetter]}</span>
              ${answered && assignment.type==='classwork' && origLetter===q.answer?' ✓':''}
            </button>`;
          }).join('')}
        </div>`;
      } else if (q.type==='truefalse') {
        optionsHtml = `<div class="tf-btns">
          ${['对','错'].map(v=>{
            let cls='';
            if (answered) {
              if (assignment.type==='classwork' && v===q.answer) cls='correct';
              else if (v===userAns&&!isCorrect) cls='wrong';
            } else if (state.homeworkAnswers[q.id]===v) cls='selected';
            return `<button class="tf-btn ${cls}" onclick="${answered?'':'selectAnswer(\''+q.id+'\',\''+(v==='对'?'true':'false')+'\')'}" ${answered?'disabled':''}>${v}</button>`;
          }).join('')}
        </div>`;
      } else if (q.type==='matching') {
        // 连线题渲染
        let leftItems = [], rightItems = [], correctMap = {};
        try { leftItems = Array.isArray(q.leftItems)?q.leftItems:JSON.parse(q.leftItems||'[]'); } catch(e){}
        try { rightItems = Array.isArray(q.rightItems)?q.rightItems:JSON.parse(q.rightItems||'[]'); } catch(e){}
        try { correctMap = typeof q.answer==='object'?q.answer:JSON.parse(q.answer||'{}'); } catch(e){}
        // 用户当前作答（JSON字符串或对象）
        let userMatchMap = {};
        if (answered) {
          try { userMatchMap = typeof userAns==='object'?userAns:JSON.parse(userAns||'{}'); } catch(e){}
        } else {
          try {
            const cur = state.homeworkAnswers[q.id];
            userMatchMap = cur ? (typeof cur==='object'?cur:JSON.parse(cur)) : {};
          } catch(e){}
        }
        // 右列保持原始顺序展示
        const shuffledRight = [...rightItems];
        if (answered) {
          // 查看模式：逐行展示左→用户选择，标注对错
          optionsHtml = `<div style="margin:10px 0;">
            <div style="display:grid;grid-template-columns:1fr 24px 1fr 60px;gap:6px;align-items:center;font-size:.85rem;margin-bottom:4px;">
              <div style="font-weight:600;color:#888;">左列</div><div></div><div style="font-weight:600;color:#888;">你的连线</div><div></div>
            </div>
            ${leftItems.map((l,i)=>{
              const idx = String(i+1);
              // userMatchMap 存的是右列下标字符串，查表得实际内容
              const userRight = rightItems[Number(userMatchMap[idx])]||userMatchMap[idx]||'';
              // correctMap 存的是右列下标，需查表得实际内容
              const correctRight = rightItems[Number(correctMap[idx])]||'';
              const ok = userRight===correctRight;
              return `<div style="display:grid;grid-template-columns:1fr 24px 1fr 60px;gap:6px;align-items:center;margin-bottom:6px;">
                <div style="padding:6px 10px;background:#f5f5f5;border-radius:6px;">${l}</div>
                <div style="text-align:center;color:#aaa;">→</div>
                <div style="padding:6px 10px;border-radius:6px;border:2px solid ${ok?'#43a047':'#e57373'};background:${ok?'#e8f5e9':'#ffebee'};color:${ok?'#2e7d32':'#c62828'};">${userRight||'（未作答）'}</div>
                <div style="font-size:.82rem;font-weight:700;color:${ok?'var(--success)':'var(--danger)'};">${ok?'✓ 正确':'✗ 错误'}</div>
              </div>`;
            }).join('')}
            ${assignment.type==='classwork'?'<div style="margin-top:8px;padding:8px 12px;background:#f8f9fa;border-radius:6px;font-size:.82rem;">'+
              '<span style="color:#888;">正确答案：</span> '+
              leftItems.map((l,i)=>'<span style="margin-right:12px;">'+l+' → <span style="color:var(--success);">'+(rightItems[Number(correctMap[String(i+1)])]||'?')+'</span></span>').join('')+
            '</div>':''}
          </div>`;
        } else {
          // 答题模式：左列点选 + 右列点选，点击配对
          const curMap = userMatchMap;
          optionsHtml = `<div class="matching-area" id="matching_${q.id}" style="margin:10px 0;">
            <div style="display:flex;gap:16px;">
              <div style="flex:1;">
                <div style="font-size:.78rem;font-weight:600;color:#888;margin-bottom:8px;text-align:center;">左列</div>
                ${leftItems.map((l,i)=>{
                  const idx = String(i+1);
                  const connectedRight = curMap[idx];
                  return `<div class="match-left-item ${connectedRight?'match-connected':''}" id="ml_${q.id}_${i}"

function selectAnswer(qId, ans) {
  // 统一答案格式：中文转英文，与考试系统对齐
  if (ans === '对') ans = 'true';
  if (ans === '错') ans = 'false';
  state.homeworkAnswers[qId] = ans;
  // 高亮更新
  const parent = document.getElementById('mainContent');
  parent.querySelectorAll(`[onclick*="selectAnswer('${qId}'"]`).forEach(btn=>{
    btn.classList.remove('selected');
  });
  parent.querySelectorAll(`[onclick*="selectAnswer('${qId}','${ans}'"]`).forEach(btn=>{
    btn.classList.add('selected');
  });
  // TF 按钮
  parent.querySelectorAll(`.tf-btn`).forEach(btn=>{
    if (btn.getAttribute('onclick')&&btn.getAttribute('onclick').includes(qId)) {
      btn.classList.remove('selected');
      if (btn.getAttribute('onclick').includes(`'${ans}'`)) btn.classList.add('selected');
    }
  });
}

// 材料题子题作答
function selectMaterialChildAnswer(qId, childIdx, answer) {
  if (!state.homeworkAnswers[qId]) state.homeworkAnswers[qId] = { children: [] };
  if (!state.homeworkAnswers[qId].children) state.homeworkAnswers[qId] = { children: [] };
  state.homeworkAnswers[qId].children[childIdx] = answer;
  // 高亮更新（支持选择题和判断题，统一使用 data-mcid/data-mcans 属性）
  const parent = document.getElementById('mainContent');
  parent.querySelectorAll('[data-mcid="' + qId + '_' + childIdx + '"]').forEach(btn => {
    btn.classList.remove('selected');
  });
  parent.querySelectorAll('[data-mcid="' + qId + '_' + childIdx + '"][data-mcans="' + answer + '"]').forEach(btn => {
    btn.classList.add('selected');
  });
}

function onMaterialFillInput(qId, childIdx, el) {
  if (!state.homeworkAnswers[qId]) state.homeworkAnswers[qId] = { children: [] };
  if (!state.homeworkAnswers[qId].children) state.homeworkAnswers[qId] = { children: [] };
  state.homeworkAnswers[qId].children[childIdx] = el.value;
}

// 材料题子题 - 连线题辅助渲染
var _matSelQ=null,_matSelI=null;
function _renderMatMatching(qId,ci,leftItems,rightItems){
  var cid=qId+'_'+ci,cont=document.getElementById('_mm_'+cid);
  if(!cont)return;
  var map={};
  try{var a=state.homeworkAnswers[qId]&&state.homeworkAnswers[qId].children?state.homeworkAnswers[qId].children[ci]:null;map=a?(typeof a==='object'?a:JSON.parse(a)):{};}catch(e){}
  var h='<div style="display:flex;gap:12px;">';
  // 左列
  h+='<div style="flex:1;"><div style="font-size:.75rem;font-weight:600;color:#888;margin-bottom:6px;text-align:center;">左列</div>';
  for(var li=0;li<leftItems.length;li++){
    var idx=String(li+1),c=map[idx];
    var bg=c?'#e8f5e9':'#fff',bd=c?'2px solid #4caf50':'2px solid #ddd';
    h+='<div id="_ml_'+cid+'_'+li+'" data-i="'+idx+'" onclick="_matClickL('+qId+','+ci+','+li+')" style="padding:6px 10px;margin-bottom:4px;border:'+bd+';border-radius:6px;cursor:pointer;font-size:.82rem;text-align:center;background:'+bg+';"><b style="color:var(--primary);">'+(li+1)+'.</b> '+leftItems[l]+(c?' <span style="font-size:.7rem;color:#4caf50;">→ '+c+'</span>':'')+'</div>';
  }
  h+='</div>';
  // 中间
  h+='<div style="display:flex;align-items:center;"><span style="color:#ccc;font-size:1.2rem;">⟷</span></div>';
  // 右列
  h+='<div style="flex:1;"><div style="font-size:.75rem;font-weight:600;color:#888;margin-bottom:6px;text-align:center;">右列（点击连线）</div>';
  for(var ri=0;ri<rightItems.length;ri++){
    var used=Object.values(map).includes(String(ri));
    var bg2=used?'#e8f5e9':'#fff',bd2=used?'2px solid #4caf50':'2px solid #ddd';
    h+='<div id="_mr_'+cid+'_'+ri+'" onclick="_matClickR('+qId+','+ci+','+ri+')" style="padding:6px 10px;margin-bottom:4px;border:'+bd2+';border-radius:6px;cursor:pointer;font-size:.82rem;text-align:center;background:'+bg2+';">'+rightItems[ri]+'</div>';
  }
  h+='</div></div><p style="font-size:.72rem;color:#aaa;margin-top:6px;text-align:center;">先点击左列，再点击右列完成连线</p>';
  cont.innerHTML=h;
}
function _matClickL(qId,ci,li){
  var cid=qId+'_'+ci,idx=String(li+1);
  if(!state.homeworkAnswers[qId])state.homeworkAnswers[qId]={children:[]};
  if(!state.homeworkAnswers[qId].children)state.homeworkAnswers[qId]={children:[]};
  var m={};
  try{m=state.homeworkAnswers[qId].children[ci]?(typeof state.homeworkAnswers[qId].children[ci]==='object'?state.homeworkAnswers[qId].children[ci]:JSON.parse(state.homeworkAnswers[qId].children[ci])):{};}catch(e){}
  if(m[idx]){delete m[idx];_matSelQ=null;_matSelI=null;}
  else{_matSelQ=cid;_matSelI=li;}
  state.homeworkAnswers[qId].children[ci]=m;
  _refreshMatUI(qId,ci);
}
function _matClickR(qId,ci,ri){
  if(!_matSelQ)return;
  var cid=qId+'_'+ci;
  if(!state.homeworkAnswers[qId])state.homeworkAnswers[qId]={children:[]};
  if(!state.homeworkAnswers[qId].children)state.homeworkAnswers[qId]={children:[]};
  var m={};
  try{m=state.homeworkAnswers[qId].children[ci]?(typeof state.homeworkAnswers[qId].children[ci]==='object'?state.homeworkAnswers[qId].children[ci]:JSON.parse(state.homeworkAnswers[qId].children[ci])):{};}catch(e){}
  m[String(_matSelI+1)]=String(ri);
  state.homeworkAnswers[qId].children[ci]=m;
  _matSelQ=null;_matSelI=null;
  _refreshMatUI(qId,ci);
}
function _refreshMatUI(qId,ci){
  var cid=qId+'_'+ci;
  var el=document.getElementById('_mm_'+cid);
  if(!el)return;
  var m={};
  try{m=state.homeworkAnswers[qId]&&state.homeworkAnswers[qId].children&&state.homeworkAnswers[qId].children[ci]?(typeof state.homeworkAnswers[qId].children[ci]==='object'?state.homeworkAnswers[qId].children[ci]:JSON.parse(state.homeworkAnswers[qId].children[ci])):{};}catch(e){}
  // 更新左列
  var leftItems=el.querySelectorAll('[data-i]');
  for(var i=0;i<leftItems.length;i++){
    var ix=leftItems[i].getAttribute('data-i');
    var conn=m[ix];
    if(conn){leftItems[i].style.border='2px solid #4caf50';leftItems[i].style.background='#e8f5e9';}
    else{leftItems[i].style.border='2px solid #ddd';leftItems[i].style.background='#fff';}
    // 高亮选中态
    if(_matSelQ===cid&&_matSelI!==null&&i===_matSelI){
      leftItems[i].style.border='2px solid #e53935';
      leftItems[i].style.background='#fce4ec';
    }
  }
  // 更新右列
  var rightItems=el.querySelectorAll('[id^="_mr_'+cid+'"]');
  for(var j=0;j<rightItems.length;j++){
    var used=Object.values(m).includes(String(j));
    if(used){rightItems[j].style.border='2px solid #4caf50';rightItems[j].style.background='#e8f5e9';}
    else{rightItems[j].style.border='2px solid #ddd';rightItems[j].style.background='#fff';}
  }
  // 绘制连线
  _drawMatLines(qId,ci);
}
// 材料题子题 - 绘制SVG连线（红色直线）
function _drawMatLines(qId,ci){
  var cid=qId+'_'+ci;
  var el=document.getElementById('_mm_'+cid);
  var svg=document.getElementById('_ms_'+cid);
  if(!el||!svg)return;
  // 获取容器相对于viewport的位置信息
  var rect=el.getBoundingClientRect();
  // 设置SVG尺寸匹配容器
  svg.setAttribute('width',rect.width);
  svg.setAttribute('height',rect.height);
  svg.innerHTML='';
  // 获取配对数据
  var m={};
  try{m=state.homeworkAnswers[qId]&&state.homeworkAnswers[qId].children&&state.homeworkAnswers[qId].children[ci]?(typeof state.homeworkAnswers[qId].children[ci]==='object'?state.homeworkAnswers[qId].children[ci]:JSON.parse(state.homeworkAnswers[qId].children[ci])):{};}catch(e){}
  // 为每个配对画红线
  var leftItems=el.querySelectorAll('[data-i]');
  for(var li=0;li<leftItems.length;li++){
    var idx=leftItems[li].getAttribute('data-i');
    var riNum=m[idx];
    if(riNum===undefined||riNum===null||riNum==='')continue;
    var ri=Number(riNum);
    var rEl=document.getElementById('_mr_'+cid+'_'+ri);
    if(!rEl)continue;
    // 计算坐标（相对于SVG容器）
    var lRect=leftItems[li].getBoundingClientRect();
    var rRect=rEl.getBoundingClientRect();
    var x1=lRect.right-rect.left;
    var y1=lRect.top+lRect.height/2-rect.top;
    var x2=rRect.left-rect.left;
    var y2=rRect.top+rRect.height/2-rect.top;
    // 创建红色直线
    var line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);
    line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('stroke','#e53935');
    line.setAttribute('stroke-width','2.5');
    svg.appendChild(line);
  }
}

// 材料题子题 - 排序题输入处理
function _onMatSortIn(el){
  el.value=el.value.toUpperCase();
  if(el.value&&el.nextElementSibling&&el.nextElementSibling.tagName==='INPUT')el.nextElementSibling.focus();
  var mp=el.getAttribute('data-mp');
  var lastU=mp.lastIndexOf('_'),posPart=mp.substring(lastU+1),idPart=mp.substring(0,lastU);
  var parts=idPart.split('_'),qId=parts.slice(0,-1).join('_'),childIdx=Number(parts[parts.length-1]);
  // 向上查找包含所有同级输入的容器（不再要求el必须是第一个）
  var container=null,p=el.parentNode;
  while(p){
    var inps=p.querySelectorAll('[data-mp^="'+idPart+'_"]');
    if(inps.length>0){container=p;break;}
    p=p.parentElement;
  }
  if(container){var ans='',inputs=container.querySelectorAll('[data-mp^="'+idPart+'_"]');inputs.forEach(function(inp){ans+=inp.value;});
  if(!state.homeworkAnswers[qId])state.homeworkAnswers[qId]={children:[]};
  if(!state.homeworkAnswers[qId].children)state.homeworkAnswers[qId]={children:[]};
  state.homeworkAnswers[qId].children[childIdx]=ans;}
}
function _onMatSortKD(e,el){if(e.key==='Backspace'&&!el.value&&el.previousElementSibling&&el.previousElementSibling.tagName==='INPUT')el.previousElementSibling.focus();}

// 连线题交互
let _matchingSelectedQid = null;
let _matchingSelectedIdx = null;

function selectMatchLeft(qId, idx) {
  // 如果已连线，点击取消
  const cur = state.homeworkAnswers[qId];
  let curMap = {};
  try { curMap = cur?(typeof cur==='object'?cur:JSON.parse(cur)):{} } catch(e){}
  const idxStr = String(idx+1);
  if (curMap[idxStr]) {
    // 取消连线
    delete curMap[idxStr];
    state.homeworkAnswers[qId] = JSON.stringify(curMap);
    _matchingSelectedQid = null; _matchingSelectedIdx = null;
    refreshMatchingUI(qId);
    return;
  }
  // 选中左项，等待右项点击
  _matchingSelectedQid = qId;
  _matchingSelectedIdx = idx;
  // 高亮选中
  document.querySelectorAll(`[id^="ml_${qId}_"]`).forEach(el=>{
    el.style.borderColor = '';
    el.style.background = '#fff';
  });
  const el = document.getElementById(`ml_${qId}_${idx}`);
  if (el) { el.style.borderColor = 'var(--primary)'; el.style.background = '#e3f2fd'; }
}

function selectMatchRight(qId, idx) {
  if (_matchingSelectedQid !== qId || _matchingSelectedIdx === null) return;
  const cur = state.homeworkAnswers[qId];
  let curMap = {};
  try { curMap = cur?(typeof cur==='object'?cur:JSON.parse(cur)):{} } catch(e){}
  // 检查右列下标是否已被使用，若已使用则取消旧连线
  const idxStr = String(idx);
  Object.keys(curMap).forEach(k=>{ if (curMap[k]===idxStr) delete curMap[k]; });
  curMap[String(_matchingSelectedIdx+1)] = idxStr;
  state.homeworkAnswers[qId] = JSON.stringify(curMap);
  _matchingSelectedQid = null; _matchingSelectedIdx = null;
  refreshMatchingUI(qId);
}

// ─── 连线题 SVG 连接线 ─────────────────────────────
function drawMatchingLines(qId, correctMap) {
  const area = document.getElementById(`matching_${qId}`);
  if (!area) return;
  let leftItems = [], rightItems = [];
  const q = state.questions.find(x=>x.id===qId);
  if (q) {
    try { leftItems = Array.isArray(q.leftItems)?q.leftItems:JSON.parse(q.leftItems||'[]'); } catch(e){}
    try { rightItems = Array.isArray(q.rightItems)?q.rightItems:JSON.parse(q.rightItems||'[]'); } catch(e){}
  }
  let curMap = {};
  const cur = state.homeworkAnswers[qId];
  try { curMap = cur?(typeof cur==='object'?cur:JSON.parse(cur)):{} } catch(e){}

  let svg = area.querySelector('.match-lines-svg');
  if (!svg) {
    svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.classList.add('match-lines-svg');
    svg.style.position = 'absolute';
    svg.style.top = '0';
    svg.style.left = '0';
    svg.style.width = '100%';
    svg.style.height = '100%';
    svg.style.pointerEvents = 'none';
    svg.style.zIndex = '0';
    svg.style.overflow = 'visible';
    area.style.position = 'relative';
    area.insertBefore(svg, area.firstChild);
  }
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const areaRect = area.getBoundingClientRect();
  if (areaRect.width === 0) return;

  Object.keys(curMap).forEach(key => {
    const leftIdx = parseInt(key) - 1;
    const rightKey = curMap[key];
    const rightIdx = parseInt(rightKey);
    if (isNaN(leftIdx) || isNaN(rightIdx)) return;

    const leftEl = document.getElementById(`ml_${qId}_${leftIdx}`);
    const rightEl = document.getElementById(`mr_${qId}_${rightIdx}`);
    if (!leftEl || !rightEl) return;

    const leftRect = leftEl.getBoundingClientRect();
    const rightRect = rightEl.getBoundingClientRect();

    const x1 = leftRect.right - areaRect.left;
    const y1 = leftRect.top + leftRect.height/2 - areaRect.top;
    const x2 = rightRect.left - areaRect.left;
    const y2 = rightRect.top + rightRect.height/2 - areaRect.top;

    const cpOff = Math.max(30, (x2 - x1) * 0.4);
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${x1},${y1} C${x1+cpOff},${y1} ${x2-cpOff},${y2} ${x2},${y2}`);

    // 查看模式：correctMap 存在时按对错上色
    let strokeColor = '#1565c0';
    if (correctMap && correctMap[key] !== undefined) {
      const isCorrect = String(rightKey) === String(correctMap[key]);
      strokeColor = isCorrect ? '#2e7d32' : '#c62828';
    }
    path.setAttribute('stroke', strokeColor);
    path.setAttribute('stroke-width', '2.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    svg.appendChild(path);
  });
}

// 窗口 resize 时重绘所有可见连线
let _matchLineResizeHandler = null;
if (typeof window !== 'undefined') {
  _matchLineResizeHandler = () => {
    document.querySelectorAll('[id^="matching_"]').forEach(el => {
      const qId = el.id.replace('matching_','');
      if (qId) drawMatchingLines(qId);
    });
    // DQ/BT 主题目连线
    document.querySelectorAll('[id^="dq_matching_"]').forEach(el => { const qId = el.id.replace('dq_matching_',''); if (qId) drawDqMatchingLines(qId); });
    document.querySelectorAll('[id^="bt_matching_"]').forEach(el => { const qId = el.id.replace('bt_matching_',''); if (qId) drawBtMatchingLines(qId); });
    // DQ/BT 材料子题连线
    document.querySelectorAll('[id^="dqmat_matching_"]').forEach(el => {
      const m = el.id.match(/^dqmat_matching_(.+)_(\d+)$/);
      if (m) drawDqMatMatchingLines(m[1], parseInt(m[2]));
    });
    document.querySelectorAll('[id^="btmat_matching_"]').forEach(el => {
      const m = el.id.match(/^btmat_matching_(.+)_(\d+)$/);
      if (m) drawBtMatMatchingLines(m[1], parseInt(m[2]));
    });
  };
  window.addEventListener('resize', _matchLineResizeHandler);
}

function refreshMatchingUI(qId) {
  const q = state.questions.find(x=>x.id===qId);
  if (!q) return;
  let leftItems = [], rightItems = [];
  try { leftItems = Array.isArray(q.leftItems)?q.leftItems:JSON.parse(q.leftItems||'[]'); } catch(e){}
  try { rightItems = Array.isArray(q.rightItems)?q.rightItems:JSON.parse(q.rightItems||'[]'); } catch(e){}
  const shuffledRight = [...rightItems];
  const cur = state.homeworkAnswers[qId];
  let curMap = {};
  try { curMap = cur?(typeof cur==='object'?cur:JSON.parse(cur)):{} } catch(e){}
  // 刷新左列
  leftItems.forEach((l,i)=>{
    const el = document.getElementById(`ml_${qId}_${i}`);
    if (!el) return;
    const connected = curMap[String(i+1)];
    const connectedContent = connected !== undefined ? (rightItems[Number(connected)] || connected) : '';
    el.style.borderColor = connected?'var(--success)':'var(--border)';
    el.style.background = connected?'#e8f5e9':'#fff';
    el.innerHTML = `<span style="font-weight:700;color:var(--primary);">${i+1}.</span> ${l}${connected?`<div style="font-size:.75rem;color:var(--success);margin-top:2px;">→ ${connectedContent}</div>`:''}`;
  });
  // 刷新右列
  shuffledRight.forEach((r,i)=>{
    const el = document.getElementById(`mr_${qId}_${i}`);
    if (!el) return;
    const used = Object.values(curMap).includes(String(i));
    el.style.borderColor = used?'var(--success)':'var(--border)';
    el.style.background = used?'#e8f5e9':'#fff';
  });
  // 重绘连线
  setTimeout(() => drawMatchingLines(qId), 0);
}
