//  课堂作业页
// ═══════════════════════════════════════════════
async function renderClassworkPage() {
  const myClasswork = state.assignments.filter(a =>
    a.type === 'classwork' && a.grade === me.grade && a.className === me.className
  );
  const latestSubMap = {};
  (state.submissions||[]).forEach(s => {
    if (!latestSubMap[s.assignmentId] || s.submittedAt > latestSubMap[s.assignmentId].submittedAt) {
      latestSubMap[s.assignmentId] = s;
    }
  });

  if (!myClasswork.length) {
    document.getElementById('mainContent').innerHTML = '<div class="empty"><div class="icon">📝</div><p>老师还没有下发课堂作业</p></div>';
    return;
  }

  document.getElementById('mainContent').innerHTML = `<div>
    <div class="card-title" style="font-size:1.2rem;margin-bottom:16px;">📝 课堂作业</div>
    ${myClasswork.sort((a,b)=>b.assignedAt-a.assignedAt).map(a => {
      const sub = latestSubMap[a.id];
      const passed = sub && sub.passed;
      const failed = sub && !sub.passed;
      const minRate = a.minPassRate !== undefined ? a.minPassRate : 60;
      return `<div class="card" style="margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:16px;cursor:pointer;" onclick="openClasswork('${a.id}')">
          <span style="font-size:2rem;">${passed?'✅':failed?'⚠️':'📝'}</span>
          <div style="flex:1;">
            <div style="font-weight:600;font-size:1rem;">${a.title||'课堂作业'}</div>
            <div style="font-size:.82rem;color:#888;margin-top:3px;">满分 ${a.points} 分 · ${a.questions.length} 题 · 最低 ${minRate}% 达标</div>
            ${passed ? `<div style="font-size:.82rem;color:#2e7d32;margin-top:3px;">已完成（得分率 ${sub.score}%）</div>` : ''}
            ${failed ? `<div style="font-size:.82rem;color:#e65100;margin-top:3px;">未达标（得分率 ${sub.score}%，需 ≥${minRate}%）</div>` : ''}
          </div>
          <span style="color:#bbb;font-size:1.5rem;">›</span>
        </div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
          ${passed
            ? `<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openClasswork('${a.id}',true)">📊 查看结果</button>`
            : failed
            ? `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openClasswork('${a.id}')">🔄 重新作答</button>`
            : `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openClasswork('${a.id}')">📝 开始作答（${a.questions.length}题）</button>`}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function openClasswork(assignmentId, reviewMode=false) {
  const assignment = state.assignments.find(a=>a.id===assignmentId);
  if (!assignment) return;
  const existing = (state.submissions||[]).filter(s=>s.assignmentId===assignmentId && s.studentId===me.id)
    .sort((a,b)=>b.submittedAt-a.submittedAt)[0];
  const passed = existing && existing.passed;
  if (passed && !reviewMode) {
    toast('该作业已达标完成，无需再次作答', 'success');
    return;
  }
  // 题目随机打乱
  let qs = (assignment.questions||[]).map(qId=>state.questions.find(q=>q.id===qId)).filter(Boolean);
  if (!reviewMode) {
    for (let i=qs.length-1;i>0;i--) {
      const j=Math.floor(Math.random()*(i+1));
      [qs[i],qs[j]]=[qs[j],qs[i]];
    }
    state.questionOrder = qs.map(q=>q.id);
    state.optionShuffle = {};
    qs.forEach(q => {
      if (q.type==='choice') {
        const origLetters=['A','B','C','D'].filter(o=>q['option'+o]);
        const shuffled=[...origLetters];
        for (let i=shuffled.length-1;i>0;i--) {
          const j=Math.floor(Math.random()*(i+1));
          [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
        }
        const map={};
        origLetters.forEach((displayLetter,idx)=>{ map[displayLetter]=shuffled[idx]; });
        state.optionShuffle[q.id]=map;
      }
    });
  } else {
    state.questionOrder = {};
    state.optionShuffle = {};
  }
  state.homeworkAnswers = {};
  state.hwSubmitted = false;
  document.getElementById('mainContent').innerHTML = renderHomeworkPage(assignment, qs, existing, reviewMode);
}

async function submitHomework(assignmentId) {
  const assignment = state.assignments.find(a=>a.id===assignmentId);
  if (!assignment) return;
  const qs = (assignment.questions||[]).map(qId=>state.questions.find(q=>q.id===qId)).filter(Boolean);

  // 检查填空题
  const fills = qs.filter(q=>q.type==='fill');
  fills.forEach(q=>{
    const el = document.getElementById(`fill_${q.id}`);
    if (el) state.homeworkAnswers[q.id] = el.value;
  });

  // 连线题：确保答案已序列化为JSON字符串
  qs.filter(q=>q.type==='matching').forEach(q=>{
    const cur = state.homeworkAnswers[q.id];
    if (cur && typeof cur === 'object') {
      state.homeworkAnswers[q.id] = JSON.stringify(cur);
    } else if (!cur) {
      state.homeworkAnswers[q.id] = '{}';
    }
  });

  // 排序题：收集答案（拼接已知项+学生填写项）
  qs.filter(q=>q.type==='sort').forEach(q=>{
    state.homeworkAnswers[q.id] = collectSortAnswer(q) || (state.homeworkAnswers[q.id] || '').toUpperCase();
  });

  // 选择题：将显示字母映射回原始字母（因为选项顺序已随机打乱）
  qs.filter(q=>q.type==='choice').forEach(q=>{
    const shuffle = state.optionShuffle[q.id];
    const displayAns = state.homeworkAnswers[q.id];
    if (shuffle && displayAns) {
      state.homeworkAnswers[q.id] = shuffle[displayAns] || displayAns;
    }
  });

  // Python 题：从 textarea 取最新代码
  qs.filter(q=>q.type==='pycode').forEach(q=>{
    const el = document.getElementById('pycode_' + q.id);
    if (el) state.homeworkAnswers[q.id] = el.value || '';
  });

  const answers = qs.map(q=>{
    let ans = state.homeworkAnswers[q.id] || '';
    if (q.type === 'material' && typeof ans === 'object') ans = JSON.stringify(ans);
    return { questionId: q.id, answer: ans };
  });

  const result = await fetch('/api/submissions', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ assignmentId, studentId:me.id, answers })
  }).then(r=>r.json());

  state.submissions.push(result);
  // 只有passed才更新前端积分显示
  if (result.passed) {
    const assignment = state.assignments.find(a=>a.id===assignmentId);
    const basePoints = (assignment && assignment.points !== undefined) ? assignment.points : (state.settings.pointsPerHomework||10);
    const earned = Math.round(basePoints * (result.score / 100));
    me.points = (me.points||0) + earned;
    me.petPoints = (me.petPoints||0) + earned;
    document.getElementById('myPointsBadge').textContent = `⭐ ${me.points}`;
    document.getElementById('myPetPointsBadge').textContent = `🐾 ${me.petPoints}`;
    toast(`提交成功！得分 ${result.score} 分，获得 ${earned} 积分 🎉`);
  } else {
    const minRate = result.minPassRate !== undefined ? result.minPassRate : 60;
    toast(`提交完成，得分 ${result.score} 分（未达到最低得分率 ${minRate}%，不计为完成）`, 'warning');
  }
  // 显示结果
  openAssignment(assignmentId, true);
}

// ─── 下拉填空题渲染（学生端） ───────────────────────────────────
function renderSelectFillStu(q, reviewMode, userAns, mcid) {
  const blanks = q.blanks || [];
  if (!blanks.length) return '<p style="color:#e53935;">（题目配置有误）</p>';
  const curAnswers = (() => {
    try {
      let raw;
      if (reviewMode) raw = userAns;
      else if (mcid) {
        // 材料题子题：state.homeworkAnswers[mcid的父q.id].children[mcid子索引]
        const parts = mcid.split('_');
        const pQId = parts[0];
        const ci = parseInt(parts[1]);
        raw = (state.homeworkAnswers[pQId] && state.homeworkAnswers[pQId].children) ? state.homeworkAnswers[pQId].children[ci] : null;
      } else {
        raw = state.homeworkAnswers[q.id];
      }
      return typeof raw === 'string' ? JSON.parse(raw || '{}') : (raw || {});
    } catch(e) { return {}; }
  })();
  const text = q.content || '';
  const parts = text.split('____');
  let html = '<div class="selectfill-wrap">';
  parts.forEach((part, i) => {
    html += escHtmlStu(part).replace(/\n/g, '<br>');
    if (i < parts.length - 1 && i < blanks.length) {
      const b = blanks[i];
      const curVal = curAnswers[String(i)] || '';
      const opts = b.options || [];
      if (reviewMode) {
        const isOk = curVal === (b.answer || '');
        html += ' <select class="sf-select' + (isOk ? ' correct' : ' wrong') + '" disabled>';
        html += '<option>' + (curVal || '--') + '</option>';
        html += '</select> ';
        if (!isOk && b.answer) html += '<span style="font-size:.78rem;color:var(--success);">（正确：' + b.answer + '）</span>';
      } else {
        html += ' <select class="sf-select" data-sfq="' + (mcid || q.id) + '" data-sfi="' + i + '" onchange="saveSelectFillStu(this)"' + (curVal ? ' data-cur="' + curVal + '"' : '') + '>';
        html += '<option value="">--请选择--</option>';
        opts.forEach(opt => {
          html += '<option value="' + opt.replace(/"/g, '&quot;') + '"' + (curVal === opt ? ' selected' : '') + '>' + opt + '</option>';
        });
        html += '</select> ';
      }
    }
  });
  html += '</div>';
  return html;
}

function escHtmlStu(text) {
  return String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ─── 学生 Python 题试运行 ─────────────────────────────────
async function pyStuDryRun(qid) {
  const code = document.getElementById('pycode_' + qid)?.value || '';
  const status = document.getElementById('pyStuStatus_' + qid);
  const result = document.getElementById('pyStuResult_' + qid);
  status.textContent = '运行中…'; status.style.color = '#666';
  result.innerHTML = '';
  try {
    const r = await fetch('/api/questions/' + qid + '/dry-run', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ code })
    });
    const data = await r.json();
    if (!r.ok) { status.textContent = '❌ ' + (data.error || '失败'); status.style.color = '#e53935'; return; }
    const passed = data.passedCount || 0, total = data.totalCount || 0;
    status.textContent = `${passed}/${total} 通过（${Math.round((data.weightedScore||0)*100)}%）· ${data.totalElapsedMs||0}ms`;
    status.style.color = passed === total ? 'var(--success)' : (passed > 0 ? '#f57c00' : 'var(--danger)');
    if (data.cases && data.cases.length) {
      result.innerHTML = '<div style="border:1px solid var(--border);border-radius:6px;padding:8px;background:#fafafa;">' + data.cases.map((c, i) => {
        const icon = c.passed ? '✅' : (c.killed ? (c.killedReason==='timeout'?'⏱️':'🛑') : '❌');
        const hiddenTag = c.hidden ? ' <span style="background:#ede7f6;color:#5e35b1;padding:1px 5px;border-radius:3px;font-size:.7rem;">🫥 隐藏用例</span>' : '';
        const expStr = c.hidden ? '<span style="color:#999;">期望：***隐藏用例***</span>' : (c.expected ? '<span style="color:#888;">期望：</span>' + escHtmlStu(String(c.expected)).slice(0,80) : '');
        const gotStr = c.got !== undefined ? ' <span style="color:#888;">实际：</span>' + escHtmlStu(String(c.got)).slice(0,80) : '';
        const err = c.stderr ? '<div style="color:#e53935;font-family:monospace;font-size:.75rem;margin-top:2px;white-space:pre-wrap;">' + escHtmlStu(c.stderr).slice(0,300) + '</div>' : '';
        return '<div style="margin-bottom:4px;font-size:.82rem;">' + icon + ' <b>用例' + (i+1) + '</b>' + hiddenTag + '（' + c.timeMs + 'ms）' + expStr + gotStr + err + '</div>';
      }).join('') + '</div>';
    }
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.style.color = '#e53935';
  }
}

function saveSelectFillStu(selectEl) {
  const mcid = selectEl.dataset.sfq; // 可能是 qId 或 "parentQId_childIdx"
  const blankIdx = selectEl.dataset.sfi;
  const val = selectEl.value;
  if (val) {
    selectEl.classList.add('answered');
  } else {
    selectEl.classList.remove('answered');
  }
  // 判断是否为材料题子题
  if (mcid && mcid.indexOf('_') > -1) {
    const parts = mcid.split('_');
    const pQId = parts[0];
    const ci = parseInt(parts[1]);
    if (!state.homeworkAnswers[pQId] || typeof state.homeworkAnswers[pQId] !== 'object' || Array.isArray(state.homeworkAnswers[pQId])) {
      state.homeworkAnswers[pQId] = { children: [] };
    }
    if (!state.homeworkAnswers[pQId].children) state.homeworkAnswers[pQId].children = [];
    let cur = state.homeworkAnswers[pQId].children[ci];
    try {
      cur = typeof cur === 'string' ? JSON.parse(cur || '{}') : (cur || {});
    } catch(e) { cur = {}; }
    cur[String(blankIdx)] = val;
    state.homeworkAnswers[pQId].children[ci] = JSON.stringify(cur);
  } else {
    let cur;
    try {
      cur = typeof state.homeworkAnswers[mcid] === 'string' ? JSON.parse(state.homeworkAnswers[mcid] || '{}') : (state.homeworkAnswers[mcid] || {});
    } catch(e) { cur = {}; }
    cur[String(blankIdx)] = val;
    state.homeworkAnswers[mcid] = JSON.stringify(cur);
  }
}

function renderSortQ(q, studentAnswer, disabled) {
  const fixed = (q.fixedPositions || '').toUpperCase();
  const answer = (studentAnswer || '').toUpperCase();
  const blanks = answer.split('');
  let blankIdx = 0;
  let displayHtml = '';
  for (let i = 0; i < fixed.length; i++) {
    if (fixed[i] === '_') {
      const val = blanks[blankIdx] || '';
      displayHtml += '<input type="text" maxlength="1" data-pos="' + i + '" value="' + val + '" '
        + (disabled ? 'disabled' : 'oninput="onSortInput(this)" onkeydown="onSortKeydown(event,this)"')
        + ' style="width:32px;height:32px;text-align:center;font-weight:700;font-size:1.1rem;border:2px solid #d1d5db;border-radius:6px;">';
      blankIdx++;
    } else {
      displayHtml += '<span style="display:inline-block;width:32px;height:32px;line-height:32px;text-align:center;font-weight:700;font-size:1.1rem;background:#d1fae5;color:#065f46;border:2px solid #10b981;border-radius:6px;">' + fixed[i] + '</span>';
    }
    if (i < fixed.length - 1) displayHtml += '<span style="color:#9ca3af;margin:0 2px;">→</span>';
  }
  return '<div id="sortContainer_' + q.id + '" style="margin:12px 0;">'
    + '<div style="font-size:.85rem;color:#666;margin-bottom:8px;">请按正确顺序填写字母（已知项已标绿）：</div>'
    + '<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">' + displayHtml + '</div>'
    + '<div style="font-size:.75rem;color:#999;margin-top:6px;">每空 ' + (q.scorePerBlank||0.5) + ' 分</div>'
    + '</div>';
}

function onSortInput(el) {
  el.value = el.value.toUpperCase();
  if (el.value && el.nextElementSibling && el.nextElementSibling.tagName === 'INPUT') {
    el.nextElementSibling.focus();
  }
}

function onSortKeydown(e, el) {
  if (e.key === 'Backspace' && !el.value && el.previousElementSibling && el.previousElementSibling.tagName === 'INPUT') {
    el.previousElementSibling.focus();
  }
}

function collectSortAnswer(q) {
  const container = document.getElementById('sortContainer_' + q.id);
  let sortAnswer = '';
  const fixed = (q.fixedPositions || '').toUpperCase();
  if (container) {
    const inputs = container.querySelectorAll('[data-pos]');
    let blankIdx = 0;
    for (let i = 0; i < fixed.length; i++) {
      if (fixed[i] === '_') {
        sortAnswer += ((inputs[blankIdx] && inputs[blankIdx].value) || '').toUpperCase();
        blankIdx++;
      }
    }
  }
  return sortAnswer;
}

// 打字练习状态
let typingState = {
  articleId: null,
  mode: 'cn',
  content: '',       // 原文（完整）
  contentLines: [],  // 按换行分割后的每行内容
  lineInputs: [],    // 每行的已输入内容
  lineDone: [],      // 每行是否已完成
  currentLine: 0,    // 当前行索引
  startTime: null,
  timerInterval: null,
  finished: false,
  composing: false,  // IME 组合文字中，忽略 input 事件
  finalCorrect: 0,
  finalTotal: 0
};

function onTypingModeChange() {
  const mode = document.getElementById('typingModeSelect').value;
  typingState.mode = mode;
  typingState.articleId = null;
  typingState.content = '';
  typingState.finished = false;
  clearInterval(typingState.timerInterval);
  // 重新渲染页面（按新模式过滤文章列表）
  document.getElementById('mainContent').innerHTML = renderTypingPage();
}

function onTypingArticleChange() {
  const sel = document.getElementById('typingArticleSelect');
  const id = sel.value;
  if (!id) { document.getElementById('typingArea').style.display = 'none'; return; }
  const article = state.typingArticles.find(a=>a.id===id);
  if (!article) return;
  typingState.articleId = id;
  typingState.mode = document.getElementById('typingModeSelect').value;
  // 预处理文章内容
  let content = article.content;
  if (typingState.mode === 'en') {
    content = content.replace(/[^\x20-\x7E\n]/g, '').trim();
  } else {
    content = content.trim();
  }
  typingState.content = content;
  
  // 按换行分割成行
  let rawLines = content.split('\n');
  
  // 进一步处理：如果某行超过30个字符，自动在合适位置换行（保持语义连贯）
  const MAX_LINE_CHARS = 30; // 每行最大字符数
  typingState.contentLines = [];
  rawLines.forEach(line => {
    line = line.trim();
    if (!line) return;
    if (line.length <= MAX_LINE_CHARS) {
      typingState.contentLines.push(line);
    } else {
      // 中文按标点分，英文按空格分
      if (typingState.mode === 'cn') {
        // 中文：按标点符号分
        const parts = line.match(/[^，。、！？；：""''（）《》【】.,!?;:""''()[\]]+[，。、！？；：""''（）《》【】.,!?;:""''()[\]]?/g);
        if (parts) {
          let current = '';
          parts.forEach(part => {
            if ((current + part).length <= MAX_LINE_CHARS) {
              current += part;
            } else {
              if (current) typingState.contentLines.push(current);
              current = part;
            }
          });
          if (current) typingState.contentLines.push(current);
        } else {
          // 没有标点，按字数强制分
          for (let i = 0; i < line.length; i += MAX_LINE_CHARS) {
            typingState.contentLines.push(line.substring(i, i + MAX_LINE_CHARS));
          }
        }
      } else {
        // 英文：按空格分
        const words = line.split(' ');
        let current = '';
        words.forEach(word => {
          if ((current + ' ' + word).trim().length <= MAX_LINE_CHARS) {
            current = (current + ' ' + word).trim();
          } else {
            if (current) typingState.contentLines.push(current);
            current = word;
          }
        });
        if (current) typingState.contentLines.push(current);
      }
    }
  });
  
  typingState.lineInputs = typingState.contentLines.map(() => '');
  typingState.lineDone = typingState.contentLines.map(() => false);
  typingState.currentLine = 0;
  typingState.startTime = null;
  typingState.finished = false;
  typingState.finalCorrect = 0;
  typingState.finalTotal = 0;
  clearInterval(typingState.timerInterval);
  document.getElementById('typingArea').style.display = '';
  document.getElementById('restartTypingBtn').style.display = '';
  document.getElementById('submitTypingBtn').disabled = true;
  document.getElementById('typingResult').style.display = 'none';
  document.getElementById('typingTime').textContent = '0s';
  updateTypingStats();
  renderTypingLines(0); // 聚焦到第一行
}

// 渲染某一行原文（逐字高亮）
function renderLineOrig(lineIdx) {
  const orig = typingState.contentLines[lineIdx] || '';
  const typed = typingState.lineInputs[lineIdx] || '';
  let html = '';
  for (let i = 0; i < orig.length; i++) {
    const ch = orig[i];
    const disp = ch === ' ' ? '&nbsp;' : ch.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (i < typed.length) {
      const match = typed[i] === ch;
      if (match) {
        // 正确的字：蓝色背景+白色文字
        html += `<span style="background:#2196F3 !important;color:#fff !important;border-radius:2px;padding:0 2px;font-weight:bold;display:inline-block;">${disp}</span>`;
      } else {
        // 错误的字：红色背景+白色文字
        html += `<span style="background:#f44336 !important;color:#fff !important;border-radius:2px;padding:0 2px;font-weight:bold;display:inline-block;">${disp}</span>`;
      }
    } else if (i === typed.length) {
      // 光标位置：下划线闪烁
      html += `<span style="border-bottom:2px solid #2196F3;animation:blink 1s infinite;display:inline-block;">${disp}</span>`;
    } else {
      // 未输入的字：深灰色（比灰色更明显）
      html += `<span style="color:#666;display:inline-block;">${disp}</span>`;
    }
  }
  return html;
}

// 渲染所有逐行对照区域
function renderTypingLines(focusLineIdx) {
  const container = document.getElementById('typingLines');
  if (!container) { console.error('typingLines容器不存在'); return; }
  const lines = typingState.contentLines;
  if (!lines || lines.length === 0) {
    container.innerHTML = '<div style="color:#999;text-align:center;padding:20px;">文章内容为空</div>';
    return;
  }
  let html = '';
  lines.forEach((lineContent, idx) => {
    const typed = typingState.lineInputs[idx] || '';
    const lineHtml = renderLineOrig(idx);
    const isCurrent = (idx === typingState.currentLine);
    // 所有行都可编辑，样式一致（不再因"已完成"而锁定）
    const inputStyle = 'width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:0 0 8px 8px;font-size:1.1rem;font-family:inherit;outline:none;transition:border .2s;box-sizing:border-box;background:#fff;border-color:' + (isCurrent ? '#4a90d9' : '#ddd') + ';';
    const inputAttr = 'onpaste="return false" oncopy="return false" oncut="return false"';
    const lineBg = isCurrent ? '#f0f7ff' : '#f8f9fa';
    const lineBorder = isCurrent ? '#4a90d9' : '#ddd';
    html += `<div class="typing-line-item" id="lineItem-${idx}" style="margin-bottom:16px;position:relative;">
      <div style="font-size:0.85rem;color:#888;margin-bottom:4px;padding-left:4px;">第 ${idx+1} 行</div>
      <div class="line-orig-display" style="font-size:1.1rem;line-height:2;letter-spacing:0.04em;user-select:none;padding:8px 12px;background:${lineBg};border-radius:8px 8px 0 0;border:2px solid ${lineBorder};border-bottom:1px solid ${lineBorder};">
        ${lineHtml}
      </div>
      <input type="text" id="lineInput-${idx}" value="${typed}" style="${inputStyle}" ${inputAttr}
        oninput="onLineInput(${idx})" onkeydown="onLineKeydown(${idx}, event)" onfocus="onLineFocus(${idx})"
        autocomplete="off" placeholder="在此输入..." />
    </div>`;
  });
  container.innerHTML = html;
  // 绑定 IME 组合事件，防止输入拼音时误识别
  container.querySelectorAll('input[id^="lineInput-"]').forEach(input => {
    input.addEventListener('compositionstart', () => { typingState.composing = true; });
    input.addEventListener('compositionend', (e) => {
      typingState.composing = false;
      // compositionend 会把最终文字写入 value，手动触发 onLineInput 处理
      const idx = parseInt(input.id.replace('lineInput-', ''));
      onLineInput(idx);
    });
  });
  // 聚焦到指定行或第一行（仅在初始渲染或明确指定时聚焦；用户主动点击时由浏览器默认 focus 处理）
  if (focusLineIdx !== undefined) {
    setTimeout(() => {
      const targetInput = document.getElementById('lineInput-' + focusLineIdx);
      if (targetInput) {
        targetInput.focus();
        targetInput.setSelectionRange(targetInput.value.length, targetInput.value.length);
      }
    }, 50);
  }
}

// 聚焦某一行（轻量更新样式，绝不重建 DOM，避免输入框销毁导致焦点丢失）
function onLineFocus(lineIdx) {
  typingState.currentLine = lineIdx;
  refreshTypingLineStyles();
}

// 只更新当前行的视觉样式（背景/边框颜色），不重建 DOM，不动 input.value
function refreshTypingLineStyles() {
  const lines = typingState.contentLines || [];
  lines.forEach((_, idx) => {
    const isCurrent = (idx === typingState.currentLine);
    const item = document.getElementById('lineItem-' + idx);
    if (!item) return;
    const origDisp = item.querySelector('.line-orig-display');
    const inputEl = document.getElementById('lineInput-' + idx);
    if (origDisp) {
      origDisp.style.background = isCurrent ? '#f0f7ff' : '#f8f9fa';
      origDisp.style.borderColor = isCurrent ? '#4a90d9' : '#ddd';
    }
    if (inputEl) {
      inputEl.style.borderColor = isCurrent ? '#4a90d9' : '#ddd';
    }
  });
}

// 更新统计
function updateTypingStats() {
  let totalCorrect = 0, totalTyped = 0;
  typingState.lineInputs.forEach((typed, idx) => {
    const orig = typingState.contentLines[idx] || '';
    const len = Math.min(typed.length, orig.length);
    for (let i = 0; i < len; i++) {
      if (typed[i] === orig[i]) totalCorrect++;
    }
    totalTyped += typed.length;
  });
  const accuracy = totalTyped > 0 ? Math.round(totalCorrect / totalTyped * 100) : 0;
  const el1 = document.getElementById('typingCorrect');
  const el2 = document.getElementById('typingTotal');
  const el3 = document.getElementById('typingAccuracy');
  if (el1) el1.textContent = totalCorrect;
  if (el2) el2.textContent = totalTyped;
  if (el3) el3.textContent = accuracy + '%';
  typingState.finalCorrect = totalCorrect;
  typingState.finalTotal = totalTyped;
  const btn = document.getElementById('submitTypingBtn');
  if (btn && totalTyped > 0) btn.disabled = false;
}

// 某一行输入变化
function onLineInput(lineIdx) {
  // 忽略 IME 组合文字期间的 input 事件（防止拼音被当成输入）
  if (typingState.composing) return;
  const inputEl = document.getElementById('lineInput-' + lineIdx);
  if (!inputEl) return;
  const typed = inputEl.value;
  const orig = typingState.contentLines[lineIdx] || '';
  typingState.lineInputs[lineIdx] = typed;
  // 启动计时
  if (!typingState.startTime && typed.length > 0) {
    typingState.startTime = Date.now();
    typingState.timerInterval = setInterval(() => {
      const secs = Math.floor((Date.now() - typingState.startTime) / 1000);
      const el = document.getElementById('typingTime');
      if (el) el.textContent = secs + 's';
    }, 500);
  }
  // 实时高亮（不锁定，行已写满也不锁定，学生可自由返回修改任何一行）
  const item = document.getElementById('lineItem-' + lineIdx);
  const origDisp = item ? item.querySelector('.line-orig-display') : null;
  if (origDisp) origDisp.innerHTML = renderLineOrig(lineIdx);
  updateTypingStats();
  // 自动跳下一行：当本行已打满且不是最后一行时，光标自动跳到下一行输入框
  // 注意：只 focus + 更新 currentLine 视觉，绝不重建 DOM（避免上次的焦点丢失 bug）
  if (orig.length > 0 && typed.length >= orig.length && !typingState.composing) {
    const next = lineIdx + 1;
    if (next < typingState.contentLines.length) {
      typingState.currentLine = next;
      refreshTypingLineStyles();
      setTimeout(() => {
        const nextInput = document.getElementById('lineInput-' + next);
        if (nextInput) {
          nextInput.focus();
          nextInput.setSelectionRange(nextInput.value.length, nextInput.value.length);
        }
      }, 80); // 稍延迟，避开 IME 残留状态
    }
  }
}

// 某一行按键（处理回车跳下一行）
function onLineKeydown(lineIdx, e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const typed = typingState.lineInputs[lineIdx] || '';
    const orig = typingState.contentLines[lineIdx] || '';
    if (typed.length >= orig.length) {
      // 本行已完成，跳下一行
      const next = lineIdx + 1;
      if (next < typingState.contentLines.length) {
        typingState.currentLine = next;
        refreshTypingLineStyles(); // 轻量更新样式，不重建 DOM
        setTimeout(() => {
          const nextInput = document.getElementById('lineInput-' + next);
          if (nextInput) nextInput.focus();
        }, 50);
      }
    }
  }
}

function restartTyping() {
  clearInterval(typingState.timerInterval);
  typingState.startTime = null;
  typingState.finished = false;
  typingState.composing = false;
  typingState.currentLine = 0;
  typingState.lineInputs = typingState.contentLines.map(() => '');
  typingState.lineDone = typingState.contentLines.map(() => false);
  typingState.finalCorrect = 0;
  typingState.finalTotal = 0;
  document.getElementById('typingTime').textContent = '0s';
  document.getElementById('submitTypingBtn').disabled = true;
  document.getElementById('typingResult').style.display = 'none';
  renderTypingLines();
  updateTypingStats();
  setTimeout(() => {
    const firstInput = document.getElementById('lineInput-0');
    if (firstInput) firstInput.focus();
  }, 50);
}

async function submitTyping() {
  // 防重复提交锁：正在提交时直接返回
  if (typingState.submitting) return;
  const correctCount = typingState.finalCorrect || 0;
  const totalCount = typingState.finalTotal || 0;
  if (!typingState.articleId || totalCount === 0) {
    toast('请先选择文章并开始练习', 'error');
    return;
  }
  typingState.submitting = true;
  const mode = typingState.mode;
  const btn = document.getElementById('submitTypingBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 提交中…'; }
  try {
    const r = await API('/api/typing-submit', {
      method: 'POST',
      body: { studentId: me.id, articleId: typingState.articleId, mode, correctCount, totalCount }
    });
    const earned = r.earnedPoints || 0;
    const accuracy = r.accuracy != null ? Math.round(r.accuracy * 100) : 0;
    const passed = r.passed === true;
    me.points = (me.points||0) + earned;
    me.petPoints = (me.petPoints||0) + earned;
    document.getElementById('myPointsBadge').textContent = `⭐ ${me.points}`;
    document.getElementById('myPetPointsBadge').textContent = `🐾 ${me.petPoints}`;
    const resultEl = document.getElementById('typingResult');
    resultEl.style.display = '';
    resultEl.innerHTML = `<div class="card" style="background:linear-gradient(135deg,#e3f2fd,#f3e5f5);border:none;">
      <div style="text-align:center;padding:20px 0;">
        <div style="font-size:2.5rem;margin-bottom:8px;">${passed ? '🏆' : '📝'}</div>
        <div style="font-size:1.2rem;font-weight:700;color:var(--primary);">${passed ? '练习完成！' : '正确率未达标'}</div>
        <div style="margin-top:12px;display:flex;gap:24px;justify-content:center;flex-wrap:wrap;">
          <div><div style="font-size:1.3rem;font-weight:700;">${correctCount}</div><div style="font-size:.78rem;color:#888;">正确字数</div></div>
          <div><div style="font-size:1.3rem;font-weight:700;">${accuracy}%</div><div style="font-size:.78rem;color:#888;">正确率</div></div>
          <div><div style="font-size:1.3rem;font-weight:700;color:${passed ? 'var(--success)' : '#999'};">${passed ? '+' + earned : '—'}</div><div style="font-size:.78rem;color:#888;">获得积分</div></div>
        </div>
        ${passed
          ? `<div style="margin-top:12px;font-size:.88rem;color:var(--success);">🎉 正确率达标，获得 ${earned} 积分！</div>`
          : `<div style="margin-top:12px;font-size:.88rem;color:#f97316;">⚠️ 正确率需达到85%及以上才能获得积分，继续加油！</div>`}
      </div>
    </div>`;
    toast(passed ? `练习完成！获得 ${earned} 积分 🎉` : `正确率${accuracy}%未达标，无积分`, passed ? 'success' : 'warning');
    // 2秒后重置回选择文章页面
    setTimeout(() => {
      clearInterval(typingState.timerInterval);
      typingState = { articleId: null, mode: typingState.mode, content: '', contentLines: [], lineInputs: [], lineDone: [], currentLine: 0, startTime: null, timerInterval: null, finished: false, composing: false, finalCorrect: 0, finalTotal: 0, submitting: false };
      const c = document.getElementById('mainContent');
      if (c) c.innerHTML = renderTypingPage();
    }, 2000);
  } catch(e) {
    toast(e.message || '提交失败，请重试', 'error');
    typingState.submitting = false;
    if (btn) { btn.disabled = false; btn.textContent = '🏆 提交获得积分'; }
  }
}

let mistakeFilterCourse = ''; // 当前筛选的课程ID

function renderMistakes() {
  const mistakes = [];
  state.submissions.forEach(sub => {
    if (sub.scoreDetail) {
      const assignment = state.assignments.find(a => a.id === sub.assignmentId);
      const course = assignment ? state.courses.find(c => c.id === assignment.courseId) : null;
      sub.scoreDetail.forEach(detail => {
        if (!detail.correct) {
          const q = state.questions.find(q => q.id === detail.questionId);
          if (q) {
            mistakes.push({
              ...q,
              courseId: course ? course.id : '',
              userAnswer: detail.answer,
              correctAnswer: detail.correctAnswer,
              assignmentName: course ? course.name : '未知课程',
              submittedAt: sub.submittedAt
            });
          }
        }
      });
    }
  });
  // 按时间倒序
  mistakes.sort((a, b) => b.submittedAt - a.submittedAt);
  // 去重：同一道题只保留最新一次
  const uniqueMistakes = [];
  const seen = new Set();
  mistakes.forEach(m => {
    if (!seen.has(m.id)) {
      seen.add(m.id);
      uniqueMistakes.push(m);
    }
  });
  // 获取有错题的课程列表（用于筛选）
  const mistakeCourseIds = [...new Set(uniqueMistakes.map(m => m.courseId).filter(Boolean))];
  const filterCourses = state.courses.filter(c => mistakeCourseIds.includes(c.id));
  
  // 根据课程筛选
  const filtered = mistakeFilterCourse 
    ? uniqueMistakes.filter(m => m.courseId === mistakeFilterCourse)
    : uniqueMistakes;
  
  if (!uniqueMistakes.length) {
    return `<div class="empty"><div class="icon">📕</div><p>太棒了，还没有错题记录</p></div>`;
  }
  return `<div>
    <h2 style="font-size:1.3rem;font-weight:700;color:var(--primary-dark);margin-bottom:16px;">📕 错题本</h2>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
      <select class="form-control" style="max-width:200px;" onchange="onMistakeCourseChange(this.value)">
        <option value="">全部课程</option>
        ${filterCourses.map(c => `<option value="${c.id}" ${mistakeFilterCourse===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
      <span style="color:#888;font-size:.9rem;">共 ${filtered.length} 道错题${mistakeFilterCourse?'（筛选中）':''}</span>
    </div>
    ${filtered.length === 0 ? '<div class="empty"><div class="icon">📕</div><p>该课程暂无错题</p></div>' :
    filtered.map((m, i) => {
      let answerPart = '';
      if (m.type === 'choice') {
        answerPart = `<div style="margin-top:10px;">
          <div style="font-size:.85rem;color:#888;margin-bottom:4px;">我的答案：${m.userAnswer||'未作答'}</div>
          <div style="font-size:.85rem;color:var(--success);">正确答案：${m.correctAnswer}</div>
        </div>`;
      } else if (m.type === 'truefalse') {
        answerPart = `<div style="margin-top:10px;">
          <div style="font-size:.85rem;color:#888;margin-bottom:4px;">我的答案：${m.userAnswer==='true'?'正确':'错误'}</div>
          <div style="font-size:.85rem;color:var(--success);">正确答案：${m.correctAnswer==='true'?'正确':'错误'}</div>
        </div>`;
      } else if (m.type === 'matching') {
        let userMap = {}, correctMap = {};
        try { userMap = typeof m.userAnswer==='object'?m.userAnswer:JSON.parse(m.userAnswer||'{}'); } catch(e){}
        try { correctMap = typeof m.correctAnswer==='object'?m.correctAnswer:JSON.parse(m.correctAnswer||'{}'); } catch(e){}
        answerPart = `<div style="margin-top:10px;font-size:.85rem;">
          <div style="color:#888;margin-bottom:4px;">连线作答情况：</div>
          ${Object.keys(correctMap).map(k=>{
            const ok = userMap[k]===correctMap[k];
            return `<div style="padding:2px 0;"><span style="color:#666;">${k}号 → </span>
              <span style="color:${ok?'var(--success)':'var(--danger)'};">${userMap[k]||'未作答'}</span>
              ${ok?'':'<span style="color:#888;"> （正确：'+correctMap[k]+'）</span>'}
            </div>`;
          }).join('')}
        </div>`;
      } else if (m.type === 'sort') {
        const fixed = (m.fixedPositions || '').toUpperCase();
        let fullUser = '';
        let blankIdx = 0;
        for (let i = 0; i < fixed.length; i++) {
          if (fixed[i] === '_') {
            fullUser += ((m.userAnswer && m.userAnswer[blankIdx]) || '_');
            blankIdx++;
          } else {
            fullUser += fixed[i];
          }
        }
        answerPart = `<div style="margin-top:10px;">
          <div style="font-size:.85rem;color:#888;margin-bottom:4px;">我的排序：${fullUser}</div>
          <div style="font-size:.85rem;color:var(--success);">正确顺序：${m.correctAnswer}</div>
        </div>`;
      } else {
        answerPart = `<div style="margin-top:10px;">
          <div style="font-size:.85rem;color:#888;margin-bottom:4px;">我的答案：${m.userAnswer||'未作答'}</div>
          <div style="font-size:.85rem;color:var(--success);">正确答案：${m.correctAnswer}</div>
        </div>`;
      }
      return `<div class="card mistake-card" style="margin-bottom:12px;padding:12px;border-left:3px solid var(--danger);">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span class="badge ${m.type==='choice'?'badge-blue':m.type==='truefalse'?'badge-orange':m.type==='matching'?'badge-purple':m.type==='sort'?'badge-purple':m.type==='pycode'?'badge-purple':'badge-green'}" style="font-size:.75rem;">
            ${{choice:'选择',truefalse:'判断',fill:'填空',matching:'连线',sort:'排序',pycode:'编程'}[m.type]||m.type}
          </span>
          <span style="font-size:.78rem;color:#999;">${m.assignmentName} · ${fmtDate(m.submittedAt)}</span>
        </div>
        <div style="font-size:.95rem;line-height:1.5;">${m.content}</div>
        ${m.type==='choice'?['A','B','C','D'].filter(o=>m['option'+o]).map(o=>`
          <div style="font-size:.88rem;color:#666;margin-top:4px;padding-left:8px;">
            ${o}. ${m['option'+o]}${m.correctAnswer===o?' ✅':m.userAnswer===o?' ❌':''}
          </div>
        `).join(''):''}
        ${answerPart}
      </div>`;
    }).join('')}
  </div>`;
}

let dqState = {
  quiz: null,
  submitted: false,
  submission: null,
  answers: {},             // { [qId]: studentAnswer }
  shuffledQuestions: [],   // 打乱后的题目列表
  optionShuffle: {},       // { [qId]: { displayLetter: origLetter } }
  currentIdx: 0,
  reviewing: false
};

let btState = {
  battle: null,            // 当前一站到底配置
  played: false,           // 今日是否已参与
  submission: null,        // 提交记录
  questions: [],           // 打乱后的题目列表
  optionShuffle: {},       // { [qId]: { displayLetter: origLetter } }
  answers: {},              // { [qId]: studentAnswer }
  currentIdx: 0,
  phase: 'idle',           // 'idle' | 'playing' | 'wrong' | 'finished'
  submitting: false
};

async function renderBattlePage() {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<div style="padding:40px;text-align:center;color:#aaa;">加载中…</div>';
  try {
    const data = await API(`/api/battle/student?studentId=${me.id}`);
    btState.battle = data.battle;
    btState.played = data.played;
    btState.submission = data.submission || null;
    btState.answers = {};
    btState.optionShuffle = {};
    btState.currentIdx = 0;
    btState.phase = 'idle';
    btState.submitting = false;

    if (!btState.battle) {
      const isExpired = data.expired;
      c.innerHTML = `<div style="padding:60px 20px;text-align:center;">
        <div style="font-size:3rem;margin-bottom:16px;">${isExpired ? '⏰' : '🔥'}</div>
        <div style="font-size:1.2rem;font-weight:700;color:#333;margin-bottom:8px;">${isExpired ? '本期挑战已结束' : '今日暂无挑战'}</div>
        <div style="color:#888;font-size:.9rem;">${isExpired ? '当前挑战有效期已过，等待老师发布新挑战' : '等待老师发布一站到底挑战'}</div>
      </div>`;
      return;
    }

    if (btState.played) {
      // 如果本地没有submission记录（刷新页面的情况），从服务端获取
      if (!btState.submission && data.submission) {
        btState.submission = data.submission;
      }
      renderBtResult(c);
      return;
    }

    // 准备题目（Fisher-Yates 乱序）
    const qs = [...(btState.battle.questionDetails || [])];
    for (let i = qs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [qs[i], qs[j]] = [qs[j], qs[i]];
    }
    // 选择题选项打乱
    qs.forEach(q => {
      if (q.type === 'choice') {
        const origLetters = ['A','B','C','D'].filter(l => q['option'+l]);
        const shuffled = [...origLetters];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const newLetters = ['A','B','C','D'].slice(0, shuffled.length);
        const map = {};
        newLetters.forEach((newL, idx) => { map[newL] = shuffled[idx]; });
        btState.optionShuffle[q.id] = map;
      }
    });
    btState.questions = qs;
    btState.phase = 'playing';
    renderBtQuestion(c);
  } catch(e) {
    c.innerHTML = `<div style="padding:40px;text-align:center;color:#f00;">加载失败：${e.message}</div>`;
  }
}

function renderBtExpiryBanner() {
  const b = btState.battle;
  if (!b) return '';
  const publishDate = new Date(b.date);
  const validDays = b.validDays || 1;
  const expireDate = new Date(publishDate);
  expireDate.setDate(expireDate.getDate() + validDays);
  const today = new Date().toISOString().slice(0, 10);
  const remainDays = Math.max(0, Math.ceil((expireDate - new Date(today)) / 86400000));
  const modeTag = b.autoRandom ? '🎲 随机抽题' : '✏️ 手动选题';
  const qInfo = b.autoRandom ? `${b.randomCount} 道题` : `${(b.questionDetails || []).length} 道题`;
  return `<div style="margin-top:8px;font-size:.78rem;color:#6b7280;display:flex;gap:12px;flex-wrap:wrap;">
    <span>📦 ${modeTag}·${qInfo}</span>
    <span>⏰ 剩余 <strong style="color:#ef4444;">${remainDays}</strong> 天有效期</span>
  </div>`;
}

// ─── 一站到底：下拉填空 + 材料题渲染 ──────────────────────
function renderBtSelectFill(q) {
  const blanks = q.blanks || [];
  if (!blanks.length) return '<p style="color:#e53935;">（题目配置有误）</p>';
  let curAnswers = {};
  try {
    const raw = btState.answers[q.id];
    curAnswers = typeof raw === 'string' ? JSON.parse(raw || '{}') : (raw || {});
  } catch(e) {}
  const text = q.content || '';
  const parts = text.split('____');
  let html = '<div class="selectfill-wrap">';
  parts.forEach((part, i) => {
    html += escHtmlStu(part).replace(/\n/g, '<br>');
    if (i < parts.length - 1 && i < blanks.length) {
      const b = blanks[i];
      const curVal = curAnswers[String(i)] || '';
      const opts = b.options || [];
      html += ' <select class="sf-select" data-btsf="' + i + '" onchange="saveBtSelectFill(this,\'' + q.id + '\')">';
      html += '<option value="">--请选择--</option>';
      opts.forEach(opt => {
        html += '<option value="' + opt.replace(/"/g, '&quot;') + '"' + (curVal === opt ? ' selected' : '') + '>' + opt + '</option>';
      });
      html += '</select> ';
    }
  });
  html += '</div>';
  return html;
}

function saveBtSelectFill(selectEl, qId) {
  const blankIdx = selectEl.dataset.btsf;
  const val = selectEl.value;
  if (val) selectEl.classList.add('answered'); else selectEl.classList.remove('answered');
  let cur = {};
  try { cur = typeof btState.answers[qId] === 'string' ? JSON.parse(btState.answers[qId] || '{}') : (btState.answers[qId] || {}); } catch(e) {}
  cur[String(blankIdx)] = val;
  btState.answers[qId] = JSON.stringify(cur);
}

function btGetMatAns(qId, ci) {
  if (!btState.answers[qId] || typeof btState.answers[qId] !== 'object' || Array.isArray(btState.answers[qId])) {
    btState.answers[qId] = { children: [] };
  }
  if (!btState.answers[qId].children) btState.answers[qId].children = [];
  return btState.answers[qId].children[ci] || '';
}

function btSetMatAns(qId, ci, val) {
  if (!btState.answers[qId] || typeof btState.answers[qId] !== 'object' || Array.isArray(btState.answers[qId])) {
    btState.answers[qId] = { children: [] };
  }
  if (!btState.answers[qId].children) btState.answers[qId].children = [];
  btState.answers[qId].children[ci] = val;
}

function renderBtMaterial(q) {
  const children = q.children || [];
  let html = '';
  children.forEach((child, ci) => {
    const childLabel = {choice:'选择',truefalse:'判断',fill:'填空',matching:'连线',sort:'排序',selectfill:'下拉填空',pycode:'编程'}[child.type] || child.type;
    const savedChild = btGetMatAns(q.id, ci);
    let childAnswerHtml = '';
    if (child.type === 'choice') {
      let optList = [];
      if (child.options && Array.isArray(child.options)) optList = child.options;
      else ['A','B','C','D'].forEach(l => { if (child['option'+l]) optList.push(child['option'+l]); });
      childAnswerHtml = optList.map((optText, oi) => {
        const letter = String.fromCharCode(65 + oi);
        const sel = savedChild === letter ? 'style="background:#e3f2fd;border-color:#ef4444;font-weight:600;"' : 'style="cursor:pointer;"';
        return `<div class="bt-option" onclick="btSelectMatChild('${q.id}',${ci},'${letter}',this)" ${sel} style="padding:12px 14px;border:2px solid #e5e7eb;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px;">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#ef4444;color:#fff;font-weight:700;font-size:.9rem;flex-shrink:0;">${letter}</span>
          <span style="font-size:.95rem;color:#333;">${optText}</span></div>`;
      }).join('');
    } else if (child.type === 'truefalse') {
      const ts = savedChild === 'true' ? 'style="background:#e3f2fd;border-color:#ef4444;font-weight:600;"' : 'style="cursor:pointer;"';
      const fs = savedChild === 'false' ? 'style="background:#e3f2fd;border-color:#ef4444;font-weight:600;"' : 'style="cursor:pointer;"';
      childAnswerHtml = `<div class="bt-option" onclick="btSetMatChildTF('${q.id}',${ci},'true',this)" ${ts} style="padding:14px;border:2px solid #e5e7eb;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px;">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#10b981;color:#fff;font-weight:700;font-size:1.1rem;flex-shrink:0;">✓</span><span style="font-size:.95rem;color:#333;">正确</span></div>
        <div class="bt-option" onclick="btSetMatChildTF('${q.id}',${ci},'false',this)" ${fs} style="cursor:pointer;padding:14px;border:2px solid #e5e7eb;border-radius:10px;display:flex;align-items:center;gap:10px;">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#ef4444;color:#fff;font-weight:700;font-size:1.1rem;flex-shrink:0;">✗</span><span style="font-size:.95rem;color:#333;">错误</span></div>`;
    } else if (child.type === 'fill') {
      childAnswerHtml = `<input class="form-control" placeholder="请输入答案" value="${(savedChild||'').replace(/"/g,'&quot;')}" oninput="btSetMatAns('${q.id}',${ci},this.value)" style="margin-top:8px;font-size:1rem;padding:12px;">`;
    } else if (child.type === 'selectfill') {
      childAnswerHtml = renderBtMatChildSF(child, q.id, ci, savedChild);
    } else if (child.type === 'sort') {
      const childWithId = { ...child, id: q.id + '_c' + ci };
      childAnswerHtml = renderSortQ(childWithId, savedChild, false);
    } else if (child.type === 'matching') {
      childAnswerHtml = renderBtMatChildMatch(child, q.id, ci, savedChild);
    }
    html += `<div style="border:1px solid #e0e0e0;border-radius:8px;padding:12px;margin-bottom:10px;background:#fafafa;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <span class="badge" style="font-size:.75rem;">${ci+1}. ${childLabel}</span>
        <span style="font-size:.78rem;color:#999;">${child.score||1}分</span>
      </div>
      ${ (child.type !== 'matching' && child.type !== 'sort' && child.type !== 'selectfill') ? '<div style="font-size:.9rem;color:#333;margin-bottom:8px;">' + (child.content||'') + '</div>' : '' }
      ${child.image ? `<img src="/uploads/questions/${child.image}" style="max-width:100%;border-radius:8px;margin-bottom:8px;">` : '' }
      ${childAnswerHtml}
    </div>`;
  });
  return html;
}

function btSelectMatChild(qId, ci, letter, el) {
  btSetMatAns(qId, ci, letter);
  el.parentElement.querySelectorAll('.bt-option').forEach(opt => { opt.style.background=''; opt.style.borderColor='#e5e7eb'; opt.style.fontWeight=''; });
  el.style.background = '#e3f2fd'; el.style.borderColor = '#ef4444'; el.style.fontWeight = '600';
}

function btSetMatChildTF(qId, ci, val, el) {
  btSetMatAns(qId, ci, val);
  el.parentElement.querySelectorAll('.bt-option').forEach(opt => { opt.style.background=''; opt.style.borderColor='#e5e7eb'; opt.style.fontWeight=''; });
  el.style.background = '#e3f2fd'; el.style.borderColor = '#ef4444'; el.style.fontWeight = '600';
}

function renderBtMatChildSF(child, qId, ci, savedChild) {
  const blanks = child.blanks || [];
  if (!blanks.length) return '<p style="color:#e53935;">（题目配置有误）</p>';
  let curAnswers = {};
  try { curAnswers = savedChild ? (typeof savedChild === 'string' ? JSON.parse(savedChild) : savedChild) : {}; } catch(e) {}
  const text = child.content || '';
  const parts = text.split('____');
  let html = '<div class="selectfill-wrap">';
  parts.forEach((part, i) => {
    html += escHtmlStu(part).replace(/\n/g, '<br>');
    if (i < parts.length - 1 && i < blanks.length) {
      const b = blanks[i];
      const curVal = curAnswers[String(i)] || '';
      const opts = b.options || [];
      html += ' <select class="sf-select" data-btmcsf="' + ci + '_' + i + '" onchange="saveBtMatChildSF(this,\'' + qId + '\',' + ci + ')">';
      html += '<option value="">--请选择--</option>';
      opts.forEach(opt => {
        html += '<option value="' + opt.replace(/"/g, '&quot;') + '"' + (curVal === opt ? ' selected' : '') + '>' + opt + '</option>';
      });
      html += '</select> ';
    }
  });
  html += '</div>';
  return html;
}

function saveBtMatChildSF(selectEl, qId, ci) {
  const parts = selectEl.dataset.btmcsf.split('_');
  const blankIdx = parts[1];
  const val = selectEl.value;
  if (val) selectEl.classList.add('answered'); else selectEl.classList.remove('answered');
  let cur = {};
  const saved = btGetMatAns(qId, ci);
  try { cur = saved ? (typeof saved === 'string' ? JSON.parse(saved) : saved) : {}; } catch(e) {}
  cur[String(blankIdx)] = val;
  btSetMatAns(qId, ci, JSON.stringify(cur));
}

function renderBtMatChildMatch(child, qId, ci, savedChild) {
  let leftItems = [], rightItems = [];
  try { leftItems = typeof child.leftItems === 'string' ? JSON.parse(child.leftItems) : (child.leftItems||[]); } catch(e) {}
  try { rightItems = typeof child.rightItems === 'string' ? JSON.parse(child.rightItems) : (child.rightItems||[]); } catch(e) {}
  let savedAns = {};
  try { savedAns = savedChild ? (typeof savedChild === 'string' ? JSON.parse(savedChild) : savedChild) : {}; } catch(e) {}
  const shuffledRight = [...rightItems];
  const areaId = 'btmat_matching_' + qId + '_' + ci;
  const prefix = 'btmat_' + qId + '_' + ci;
  const html = '<div class="matching-area" id="' + areaId + '" style="margin:8px 0;position:relative;">' +
    '<div style="display:flex;gap:12px;">' +
      '<div style="flex:1;">' +
        '<div style="font-size:.75rem;font-weight:600;color:#888;margin-bottom:6px;text-align:center;">左列</div>' +
        leftItems.map((l, i) => {
          const connected = savedAns[String(i+1)] !== undefined;
          return '<div class="match-left-item" id="' + prefix + '_ml_' + i + '" onclick="btMatSelectLeft(\'' + qId + '\',' + ci + ',' + i + ')" style="padding:6px 10px;margin-bottom:5px;border:2px solid ' + (connected?'#e53935':'var(--border)') + ';border-radius:8px;font-size:.85rem;text-align:center;background:' + (connected?'#ffebee':'#fff') + ';cursor:pointer;transition:all .2s;"><span style="font-weight:700;color:#ef4444;">' + (i+1) + '.</span> ' + l + '</div>';
        }).join('') +
      '</div>' +
      '<div style="display:flex;align-items:center;"><span style="color:#ccc;font-size:1.3rem;">⟷</span></div>' +
      '<div style="flex:1;">' +
        '<div style="font-size:.75rem;font-weight:600;color:#888;margin-bottom:6px;text-align:center;">右列（点击连线）</div>' +
        shuffledRight.map((r, i) => {
          const isUsed = Object.values(savedAns).includes(String(i));
          return '<div class="match-right-item" id="' + prefix + '_mr_' + i + '" onclick="btMatSelectRight(\'' + qId + '\',' + ci + ',' + i + ')" style="padding:6px 10px;margin-bottom:5px;border:2px solid ' + (isUsed?'#e53935':'var(--border)') + ';border-radius:8px;font-size:.85rem;text-align:center;background:' + (isUsed?'#ffebee':'#fff') + ';cursor:pointer;transition:all .2s;">' + r + '</div>';
        }).join('') +
      '</div>' +
    '</div></div>';
  setTimeout(function() { drawBtMatMatchingLines(qId, ci); }, 100);
  return html;
}

window._btMatSel = null;
function btMatSelectLeft(qId, ci, idx) {
  window._btMatSel = {qId: qId, ci: ci, idx: idx};
  var prefix = 'btmat_' + qId + '_' + ci;
  document.querySelectorAll('[id^="' + prefix + '_ml_"]').forEach(function(el) { el.style.borderColor = 'var(--border)'; el.style.background = '#fff'; });
  var el = document.getElementById(prefix + '_ml_' + idx);
  if (el) { el.style.borderColor = '#ef4444'; el.style.background = '#fef2f2'; }
}
function btMatSelectRight(qId, ci, rIdx) {
  if (!window._btMatSel || window._btMatSel.qId !== qId || window._btMatSel.ci !== ci) return;
  var lIdx = window._btMatSel.idx;
  var cur = {};
  var saved = btGetMatAns(qId, ci);
  try { cur = saved ? (typeof saved === 'string' ? JSON.parse(saved) : saved) : {}; } catch(e) {}
  cur[String(lIdx+1)] = String(rIdx);
  btSetMatAns(qId, ci, JSON.stringify(cur));
  window._btMatSel = null;
  renderBtQuestion(document.getElementById('mainContent'));
}
function drawBtMatMatchingLines(qId, ci) {
  var area = document.getElementById('btmat_matching_' + qId + '_' + ci);
  if (!area) return;
  var old = area.querySelector('.match-lines-svg');
  if (old) old.remove();
  var ls = area.querySelectorAll('.match-left-item'), rs = area.querySelectorAll('.match-right-item');
  if (!ls.length || !rs.length) return;
  var cr = area.getBoundingClientRect();
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.className.baseValue = 'match-lines-svg';
  svg.setAttribute('style', 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible;');
  var m = {};
  var saved = btGetMatAns(qId, ci);
  try { m = saved ? (typeof saved === 'string' ? JSON.parse(saved) : saved) : {}; } catch(e) {}
  for (var i = 0; i < ls.length; i++) {
    var ri = m[String(i+1)];
    if (ri === undefined) continue;
    var re = rs[Number(ri)];
    if (!re) continue;
    var lr = ls[i].getBoundingClientRect(), rr = re.getBoundingClientRect();
    var x1 = lr.right - cr.left, y1 = lr.top + lr.height / 2 - cr.top;
    var x2 = rr.left - cr.left, y2 = rr.top + rr.height / 2 - cr.top;
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M' + x1 + ',' + y1 + ' C' + (x1 + 30) + ',' + y1 + ' ' + (x2 - 30) + ',' + y2 + ' ' + x2 + ',' + y2);
    path.setAttribute('stroke', '#e53935');
    path.setAttribute('stroke-width', '2.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    svg.appendChild(path);
  }
  area.insertBefore(svg, area.firstChild);
}

function btSetMatChildMatch(qId, ci, leftIdx, rightVal) {
  var cur = {};
  var saved = btGetMatAns(qId, ci);
  try { cur = saved ? (typeof saved === 'string' ? JSON.parse(saved) : saved) : {}; } catch(e) {}
  if (rightVal) cur[String(leftIdx+1)] = String(rightVal);
  else delete cur[String(leftIdx+1)];
  btSetMatAns(qId, ci, JSON.stringify(cur));
}

    const falseStyle = saved === 'false' ? 'style="background:#e3f2fd;border-color:#ef4444;font-weight:600;"' : '';
    answerHtml = `

        <span style="font-size:.95rem;color:#333;">正确</span>
      </div>
      <div class="bt-option" onclick="btSelectTF('${q.id}','false',this)" ${falseStyle} style="cursor:pointer;padding:14px;border:2px solid #e5e7eb;border-radius:10px;display:flex;align-items:center;gap:10px;">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#ef4444;color:#fff;font-weight:700;font-size:1.1rem;flex-shrink:0;">✗</span>
        <span style="font-size:.95rem;color:#333;">错误</span>
      </div>`;
  } else if (q.type === 'fill') {
    answerHtml = `<input class="form-control" id="btFillInput" placeholder="请输入答案" value="${saved||''}"
      oninput="btState.answers['${q.id}']=this.value" style="margin-top:8px;font-size:1rem;padding:12px;">`;
  } else if (q.type === 'matching') {
    answerHtml = renderBtMatchingInput(q, saved);
  } else if (q.type === 'sort') {
    answerHtml = renderSortQ(q, btState.answers[q.id] || '', false);
  } else if (q.type === 'selectfill') {
    answerHtml = renderBtSelectFill(q);
  } else if (q.type === 'material') {
    answerHtml = renderBtMaterial(q);
  }

  c.innerHTML = `

function renderBtMatchingInput(q, savedVal) {
  let leftItems = [], rightItems = [];
  try { leftItems = typeof q.leftItems === 'string' ? JSON.parse(q.leftItems) : (q.leftItems||[]); } catch(e) {}
  try { rightItems = typeof q.rightItems === 'string' ? JSON.parse(q.rightItems) : (q.rightItems||[]); } catch(e) {}

  const shuffledRight = [...rightItems];

  let savedAns = {};
  try { savedAns = savedVal ? (typeof savedVal === 'string' ? JSON.parse(savedVal) : savedVal) : {}; } catch(e) {}

  const html = `<div class="matching-area" id="bt_matching_${q.id}" style="margin:10px 0;position:relative;">
    <div style="display:flex;gap:16px;">
      <div style="flex:1;">
        <div style="font-size:.78rem;font-weight:600;color:#888;margin-bottom:8px;text-align:center;">左列</div>
        ${leftItems.map((l,i)=>{
          const connected = savedAns[String(i+1)] !== undefined;
          return `<div class="match-left-item" id="bt_ml_${q.id}_${i}" onclick="btSelectMatchLeft('${q.id}',${i})" style="padding:8px 12px;margin-bottom:6px;border:2px solid ${connected?'#e53935':'var(--border)'};border-radius:8px;font-size:.9rem;text-align:center;background:${connected?'#ffebee':'#fff'};cursor:pointer;transition:all .2s;"><span style="font-weight:700;color:#ef4444;">${i+1}.</span> ${l}</div>`;
        }).join('')}
      </div>
      <div style="display:flex;align-items:center;"><span style="color:#ccc;font-size:1.5rem;">⟷</span></div>
      <div style="flex:1;">
        <div style="font-size:.78rem;font-weight:600;color:#888;margin-bottom:8px;text-align:center;">右列</div>
        ${shuffledRight.map((r,i)=>{
          const isUsed = Object.values(savedAns).includes(String(i));
          return `<div class="match-right-item" id="bt_mr_${q.id}_${i}" onclick="btSelectMatchRight('${q.id}',${i})" style="padding:8px 12px;margin-bottom:6px;border:2px solid ${isUsed?'#e53935':'var(--border)'};border-radius:8px;font-size:.9rem;text-align:center;background:${isUsed?'#ffebee':'#fff'};cursor:pointer;transition:all .2s;">${r}</div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
  setTimeout(() => drawBtMatchingLines(q.id), 100);
  return html;
}

window._btMatchLeftSel = null;
function btSelectMatchLeft(qid, idx) {

}
function btSelectMatchRight(qid, rIdx){
  if(!window._btMatchLeftSel||window._btMatchLeftSel.qid!==qid)return;
  var lIdx=window._btMatchLeftSel.idx;var cur={};
  try{cur=btState.answers[qid]?(typeof btState.answers[qid]==='string'?JSON.parse(btState.answers[qid]):btState.answers[qid]):{};}catch(e){}
  cur[String(lIdx+1)]=String(rIdx);btState.answers[qid]=cur;window._btMatchLeftSel=null;renderBtQuestion(document.getElementById('mainContent'));

function drawBtMatchingLines(qId){
  var c=document.getElementById('bt_matching_'+qId);if(!c)return;
  var old=c.querySelector('.match-lines-svg');if(old)old.remove();
  var ls=c.querySelectorAll('.match-left-item'),rs=c.querySelectorAll('.match-right-item');
  if(!ls.length||!rs.length)return;
  var cr=c.getBoundingClientRect();
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.className.baseValue='match-lines-svg';
  svg.setAttribute('style','position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible;');
  var m={};try{m=btState.answers[qId]?(typeof btState.answers[qId]==='string'?JSON.parse(btState.answers[qId]):btState.answers[qId]):{};}catch(e){}
  for(var i=0;i<ls.length;i++){var ri=m[String(i+1)];if(ri===undefined)continue;var re=rs[Number(ri)];if(!re)continue;
    var lr=ls[i].getBoundingClientRect(),rr=re.getBoundingClientRect();
    var x1=lr.right-cr.left,y1=lr.top+lr.height/2-cr.top,x2=rr.left-cr.left,y2=rr.top+rr.height/2-cr.top;
    var line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('stroke','#e53935');line.setAttribute('stroke-width','2.5');line.setAttribute('stroke-linecap','round');svg.appendChild(line);
  }c.appendChild(svg);
}

function btUpdateMatching(qid, leftIdx, rightVal) {
  let cur = {};
  try { cur = btState.answers[qid] ? (typeof btState.answers[qid] === 'string' ? JSON.parse(btState.answers[qid]) : btState.answers[qid]) : {}; } catch(e) {}
  if (rightVal === '') delete cur[leftIdx];
  else cur[leftIdx] = rightVal;
  btState.answers[qid] = cur;
}

async function btConfirmAnswer() {
  if (btState.submitting) return;
  const qs = btState.questions;
  const idx = btState.currentIdx;
  const q = qs[idx];
  // 排序题：从 DOM 收集答案（含材料子题排序）
  if (q.type === 'sort') {
    btState.answers[q.id] = collectSortAnswer(q) || (btState.answers[q.id] || '').toUpperCase();
  }
  if (q.type === 'material' && q.children) {
    q.children.forEach((child, ci) => {
      if (child.type === 'sort') {
        const childWithId = { ...child, id: q.id + '_c' + ci };
        const sortAns = collectSortAnswer(childWithId);
        if (sortAns) btSetMatAns(q.id, ci, sortAns);
      }
    });
  }
  let answer = btState.answers[q.id];

  if (answer === undefined || answer === '' || answer === null) {
    alert('请先选择或输入答案！');
    return;
  }

  btState.submitting = true;
  const c = document.getElementById('mainContent');

  try {
    // 即时判断（preview=true 不写库），附带 questionId 让后端直接按 ID 判断
    const result = await API('/api/battle/submit', {
      method: 'POST',
      body: {
        studentId: me.id,
        answers: { [q.id]: answer },
        currentIdx: idx,
        questionId: q.id,
        preview: true
      }
    });

    if (result.wrongAnswer) {
      // 答错了 → 游戏结束，持久化失败状态
      btState.phase = 'wrong';
      btState.submitting = false;
      // 通知后端记录失败，不允许重答，并更新本地积分显示
      btState.submitting = false;
      const stoppedAt = idx + 1; // 1-based
      const answers = { [q.id]: answer };
      const failResult = await API('/api/battle/fail', {
        method: 'POST',
        body: { studentId: me.id, answers, stoppedAt }
      });
      if (failResult.earnedPoints > 0) {
        me.points = (me.points||0) + failResult.earnedPoints;
        me.petPoints = (me.petPoints||0) + failResult.earnedPoints;
        document.getElementById('myPointsBadge').textContent = `⭐ ${me.points}`;
        document.getElementById('myPetPointsBadge').textContent = `🐾 ${me.petPoints}`;
      }
      btState.played = true;
      renderBtWrong(c, q, answer, result, stoppedAt);
    } else {
      // 答对了 → 继续下一题
      btState.submitting = false;
      const isLast = idx >= qs.length - 1;
      if (isLast) {
        btState.phase = 'finished';
        btFinish(c);
      } else {
        btState.currentIdx++;
        renderBtCorrect(c, result);
      }
    }
  } catch(e) {
    btState.submitting = false;
    alert(e.message || '提交失败，请重试');
  }
}

function renderBtCorrect(c, result) {
  const pointsPerQ = btState.battle.pointsPerQuestion || 10;
  c.innerHTML = `
  <div style="max-width:680px;margin:0 auto;padding:40px 20px;text-align:center;">
    <div style="font-size:4rem;margin-bottom:12px;">✅</div>
    <div style="font-size:1.5rem;font-weight:700;color:#10b981;margin-bottom:8px;">回答正确！</div>
    <div style="font-size:1rem;color:#666;margin-bottom:24px;">已连续答对 <strong style="color:#10b981;font-size:1.3rem;">${btState.currentIdx}</strong> 题</div>
    <button class="btn btn-primary" onclick="renderBtQuestion(document.getElementById('mainContent'))" style="padding:14px 40px;font-size:1rem;border-radius:10px;background:linear-gradient(135deg,#10b981,#059669);border:none;font-weight:700;">
      继续下一题 →
    </button>

function renderBtWrong(c, q, answer, previewResult, stoppedAt) {
  const correctAnswer = q.answer;
  const typeLabel = { choice:'选择题', truefalse:'判断题', fill:'填空题', matching:'连线题', sort:'排序题', selectfill:'下拉填空', material:'材料题', pycode:'Python编程题' };
  let correctText = correctAnswer;
  if (q.type === 'matching') {
    try {
      const ca = typeof correctAnswer === 'string' ? JSON.parse(correctAnswer) : correctAnswer;
      correctText = Object.entries(ca).map(([l, r]) => `左${parseInt(l)+1} → 右${parseInt(r)+1}`).join('，');
    } catch(e) {}
  }
  let userText = answer;
  if (q.type === 'choice') {
    // answer 和 correctAnswer 都是原始字母，直接显示对应选项内容更直观
    const userOpt = q['option' + String(answer).toUpperCase()];
    const correctOpt = q['option' + String(correctAnswer).toUpperCase()];
    userText = userOpt ? `${String(answer).toUpperCase()}. ${userOpt}` : answer;
    correctText = correctOpt ? `${String(correctAnswer).toUpperCase()}. ${correctOpt}` : correctAnswer;
  } else if (q.type === 'matching') {
    try {
      const ua = typeof answer === 'string' ? JSON.parse(answer) : answer;
      userText = Object.entries(ua).map(([l, r]) => `左${parseInt(l)+1} → 右${parseInt(r)+1}`).join('，');
    } catch(e) {}
  } else if (q.type === 'truefalse') {
    userText = answer === 'true' ? '正确' : '错误';
    correctText = correctAnswer === 'true' ? '正确' : '错误';
  } else if (q.type === 'sort') {
    const fixed = (q.fixedPositions || '').toUpperCase();
    let fullUser = '';
    let blankIdx = 0;
    for (let i = 0; i < fixed.length; i++) {
      if (fixed[i] === '_') {
        fullUser += (answer[blankIdx] || '_');
        blankIdx++;
      } else {
        fullUser += fixed[i];
      }
    }
    userText = fullUser;
    correctText = correctAnswer;
  }

  const pointsPerQ = btState.battle.pointsPerQuestion || 10;
  const correctCount = stoppedAt - 1; // 在第 stoppedAt 题答错，前 stoppedAt-1 题均答对
  const earnedPoints = correctCount * pointsPerQ;

  c.innerHTML = `
  <div style="max-width:680px;margin:0 auto;padding:40px 20px;text-align:center;">
    <div style="font-size:4rem;margin-bottom:12px;">❌</div>
    <div style="font-size:1.5rem;font-weight:700;color:#ef4444;margin-bottom:8px;">回答错误！挑战结束</div>
    <div style="background:#fff;border-radius:12px;padding:20px;margin:20px 0;text-align:left;box-shadow:0 1px 4px rgba(0,0,0,.08);">
      <div style="font-size:.85rem;color:#999;margin-bottom:6px;">${typeLabel[q.type]||'题目'}</div>
      <div style="font-size:.95rem;color:#333;margin-bottom:12px;line-height:1.6;">${q.content||''}</div>
      <div style="font-size:.82rem;padding:10px 12px;background:#fee2e2;border-radius:8px;margin-bottom:6px;">
        <span style="color:#ef4444;">❌ 你的答案：${userText}</span>
      </div>
      <div style="font-size:.82rem;padding:10px 12px;background:#d1fae5;border-radius:8px;">
        <span style="color:#10b981;">✅ 正确答案：${correctText}</span>
      </div>
    </div>
    <div style="font-size:1rem;color:#666;margin-bottom:8px;">答对 <strong style="color:#10b981;">${correctCount}</strong> 题，获得 <strong style="color:#10b981;">${earnedPoints}</strong> 积分</div>
    <div style="font-size:.8rem;color:#aaa;">挑战失败，无法重新答题</div>
  </div>`;
}

async function btFinalSubmit(c) {
  c.innerHTML = '<div style="padding:40px;text-align:center;color:#aaa;">保存中…</div>';
  try {
    // 序列化 matching 答案
    const answers = { ...btState.answers };
    btState.questions.forEach(q => {
      if (q.type === 'matching' && answers[q.id] && typeof answers[q.id] === 'object') {
        answers[q.id] = JSON.stringify(answers[q.id]);
      }
      // 材料题：序列化 children
      if (q.type === 'material' && answers[q.id] && answers[q.id].children) {
        answers[q.id] = { children: answers[q.id].children.map(c => {
          if (c && typeof c === 'object') return JSON.stringify(c);
          return c;
        })};
      }
    });

    const result = await API('/api/battle/submit', {
      method: 'POST',
      body: { studentId: me.id, answers, currentIdx: btState.currentIdx, preview: false }
    });

    btState.played = true;
    btState.submission = { ...result, answers };
    if (result.earnedPoints > 0) {
      me.points = (me.points||0) + result.earnedPoints;
      me.petPoints = (me.petPoints||0) + result.earnedPoints;
      document.getElementById('myPointsBadge').textContent = `⭐ ${me.points}`;
      document.getElementById('myPetPointsBadge').textContent = `🐾 ${me.petPoints}`;
    }
    renderBtResult(c);
  } catch(e) {
    c.innerHTML = `<div style="padding:40px;text-align:center;color:#f00;">保存失败：${e.message}</div>`;
  }
}

async function btFinish(c) {
  // 所有题目都答对 → 最终提交
  const answers = { ...btState.answers };
  btState.questions.forEach(q => {
    if (q.type === 'matching' && answers[q.id] && typeof answers[q.id] === 'object') {
      answers[q.id] = JSON.stringify(answers[q.id]);
    }
  });

  try {
    const result = await API('/api/battle/submit', {
      method: 'POST',
      body: { studentId: me.id, answers, currentIdx: btState.currentIdx, preview: false }
    });

    btState.played = true;
    btState.submission = { ...result, answers };
    if (result.earnedPoints > 0) {
      me.points = (me.points||0) + result.earnedPoints;
      me.petPoints = (me.petPoints||0) + result.earnedPoints;
      document.getElementById('myPointsBadge').textContent = `⭐ ${me.points}`;
      document.getElementById('myPetPointsBadge').textContent = `🐾 ${me.petPoints}`;
    }
    renderBtResult(c);
  } catch(e) {
    btState.phase = 'idle';
    renderBtQuestion(c);
  }
}

async function renderDailyQuizPage() {

  if (!c) return;
  c.innerHTML = '<div style="padding:40px;text-align:center;color:#aaa;">加载中…</div>';
  try {
    const data = await API(`/api/daily-quiz/student?studentId=${me.id}`);
    dqState.quiz = data.quiz;

    dqState.submission = data.submission;
    dqState.answers = {};
    dqState.optionShuffle = {};
    dqState.currentIdx = 0;
    dqState.reviewing = false;

    if (!dqState.quiz) {
      const isExpired = data.expired;
      c.innerHTML = `<div style="padding:60px 20px;text-align:center;">
        <div style="font-size:3rem;margin-bottom:16px;">${isExpired ? '⏰' : '🎯'}</div>
        <div style="font-size:1.2rem;font-weight:700;color:#333;margin-bottom:8px;">${isExpired ? '本期答题已结束' : '今日暂无答题'}</div>
        <div style="color:#888;font-size:.9rem;">${isExpired ? '当前答题有效期已过，等待老师发布新题目' : '等待老师发布每日答题题目'}</div>
      </div>`;
      return;
    }

    if (dqState.submitted) {
      // 显示已完成结果
      renderDqResult(c);
      return;
    }

    // 准备题目（打乱顺序）
    const qs = [...dqState.quiz.questionDetails];
    // Fisher-Yates shuffle
    for (let i = qs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [qs[i], qs[j]] = [qs[j], qs[i]];
    }
    // 选择题选项打乱
    qs.forEach(q => {
      if (q.type === 'choice') {
        const origLetters = ['A','B','C','D'].filter(l => q['option'+l]);
        const shuffled = [...origLetters];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const newLetters = ['A','B','C','D'].slice(0, shuffled.length);
        const map = {}; // displayLetter -> origLetter
        newLetters.forEach((newL, idx) => { map[newL] = shuffled[idx]; });
        dqState.optionShuffle[q.id] = map;
      }
    });
    dqState.shuffledQuestions = qs;
    renderDqQuestion(c);
  } catch(e) {
    c.innerHTML = `<div style="padding:40px;text-align:center;color:#f00;">加载失败：${e.message}</div>`;
  }
}

// 显示答题有效期 banner
function renderDqExpiryBanner() {
  const quiz = dqState.quiz;
  if (!quiz) return '';
  const publishDate = new Date(quiz.date);
  const validDays = quiz.validDays || 1;
  const expireDate = new Date(publishDate);
  expireDate.setDate(expireDate.getDate() + validDays);
  const today = new Date().toISOString().slice(0, 10);
  const remainDays = Math.max(0, Math.ceil((expireDate - new Date(today)) / 86400000));
  const modeTag = quiz.autoRandom ? '🎲 随机抽题' : '✏️ 手动选题';
  const qInfo = quiz.autoRandom ? `${quiz.randomCount} 道题` : `${(quiz.questionDetails || []).length} 道题`;
  return `<div style="margin-top:8px;font-size:.78rem;color:#6b7280;display:flex;gap:12px;flex-wrap:wrap;">
    <span>📦 ${modeTag}·${qInfo}</span>

// ─── 每日答题：下拉填空 + 材料题渲染 ──────────────────────
function renderDqSelectFill(q) {

function saveDqSelectFill(selectEl, qId) {

function dqGetMatAns(qId, ci) {
  if (!dqState.answers[qId] || typeof dqState.answers[qId] !== 'object' || Array.isArray(dqState.answers[qId])) {
    dqState.answers[qId] = { children: [] };
  }
  if (!dqState.answers[qId].children) dqState.answers[qId].children = [];
  return dqState.answers[qId].children[ci] || '';
}

function dqSetMatAns(qId, ci, val) {
  if (!dqState.answers[qId] || typeof dqState.answers[qId] !== 'object' || Array.isArray(dqState.answers[qId])) {
    dqState.answers[qId] = { children: [] };
  }
  if (!dqState.answers[qId].children) dqState.answers[qId].children = [];
  dqState.answers[qId].children[ci] = val;
}

function renderDqMaterial(q) {
  const children = q.children || [];
  let html = '';
  children.forEach((child, ci) => {
    const childLabel = {choice:'选择',truefalse:'判断',fill:'填空',matching:'连线',sort:'排序',selectfill:'下拉填空',pycode:'编程'}[child.type] || child.type;
    const savedChild = dqGetMatAns(q.id, ci);
    let childAnswerHtml = '';
    if (child.type === 'choice') {
      let optList = [];
      if (child.options && Array.isArray(child.options)) optList = child.options;
      else ['A','B','C','D'].forEach(l => { if (child['option'+l]) optList.push(child['option'+l]); });
      childAnswerHtml = optList.map((optText, oi) => {
        const letter = String.fromCharCode(65 + oi);
        const sel = savedChild === letter ? 'style="background:#e3f2fd;border-color:var(--primary);font-weight:600;"' : '';
        return `<div class="dq-option" onclick="dqSelectMatChild('${q.id}',${ci},'${letter}',this)" ${sel}><span class="dq-opt-letter">${letter}</span><span>${optText}</span></div>`;
      }).join('');
    } else if (child.type === 'truefalse') {
      const ts = savedChild === 'true' ? 'style="background:#e3f2fd;border-color:var(--primary);font-weight:600;"' : '';
      const fs = savedChild === 'false' ? 'style="background:#e3f2fd;border-color:var(--primary);font-weight:600;"' : '';
      childAnswerHtml = `<div class="dq-option" onclick="dqSetMatChildTF('${q.id}',${ci},'true',this)" ${ts}><span class="dq-opt-letter">✓</span><span>正确</span></div><div class="dq-option" onclick="dqSetMatChildTF('${q.id}',${ci},'false',this)" ${fs}><span class="dq-opt-letter">✗</span><span>错误</span></div>`;
    } else if (child.type === 'fill') {
      childAnswerHtml = `<input class="form-control" placeholder="请输入答案" value="${(savedChild||'').replace(/"/g,'&quot;')}" oninput="dqSetMatAns('${q.id}',${ci},this.value)" style="margin-top:8px;">`;
    } else if (child.type === 'selectfill') {

      childAnswerHtml = renderDqMatChildMatch(child, q.id, ci, savedChild);

  return html;
}

function renderDqMatChildSF(child, qId, ci, savedChild) {

function renderDqMatChildMatch(child, qId, ci, savedChild) {
  let leftItems = [], rightItems = [];
  try { leftItems = typeof child.leftItems === 'string' ? JSON.parse(child.leftItems) : (child.leftItems||[]); } catch(e) {}

    '<div style="display:flex;gap:12px;">' +
      '<div style="flex:1;">' +
        '<div style="font-size:.75rem;font-weight:600;color:#888;margin-bottom:6px;text-align:center;">左列</div>' +

window._dqMatSel = null;
function dqMatSelectLeft(qId, ci, idx) {

  var el = document.getElementById(prefix + '_ml_' + idx);
  if (el) { el.style.borderColor = '#ef4444'; el.style.background = '#fef2f2'; }
}
function dqMatSelectRight(qId, ci, rIdx) {
  if (!window._dqMatSel || window._dqMatSel.qId !== qId || window._dqMatSel.ci !== ci) return;
  var lIdx = window._dqMatSel.idx;
  var cur = {};
  var saved = dqGetMatAns(qId, ci);
  try { cur = saved ? (typeof saved === 'string' ? JSON.parse(saved) : saved) : {}; } catch(e) {}
  cur[String(lIdx+1)] = String(rIdx);

function drawDqMatMatchingLines(qId, ci) {
  var area = document.getElementById('dqmat_matching_' + qId + '_' + ci);
  if (!area) return;
  var old = area.querySelector('.match-lines-svg');
  if (old) old.remove();
  var ls = area.querySelectorAll('.match-left-item'), rs = area.querySelectorAll('.match-right-item');
  if (!ls.length || !rs.length) return;
  var cr = area.getBoundingClientRect();
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.className.baseValue = 'match-lines-svg';
  svg.setAttribute('style', 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible;');
  var m = {};
  var saved = dqGetMatAns(qId, ci);
  try { m = saved ? (typeof saved === 'string' ? JSON.parse(saved) : saved) : {}; } catch(e) {}
  for (var i = 0; i < ls.length; i++) {
    var ri = m[String(i+1)];
    if (ri === undefined) continue;
    var re = rs[Number(ri)];
    if (!re) continue;
    var lr = ls[i].getBoundingClientRect(), rr = re.getBoundingClientRect();
    var x1 = lr.right - cr.left, y1 = lr.top + lr.height / 2 - cr.top;
    var x2 = rr.left - cr.left, y2 = rr.top + rr.height / 2 - cr.top;
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M' + x1 + ',' + y1 + ' C' + (x1 + 30) + ',' + y1 + ' ' + (x2 - 30) + ',' + y2 + ' ' + x2 + ',' + y2);
    path.setAttribute('stroke', '#e53935');
    path.setAttribute('stroke-width', '2.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    svg.appendChild(path);
  }
  area.insertBefore(svg, area.firstChild);
}

function dqSetMatChildMatch(qId, ci, leftIdx, rightVal) {
  var cur = {};
  var saved = dqGetMatAns(qId, ci);

  if (rightVal) cur[String(leftIdx+1)] = String(rightVal);
  else delete cur[String(leftIdx+1)];
  dqSetMatAns(qId, ci, JSON.stringify(cur));
}

function renderDqQuestion(c) {

        <span style="font-weight:700;font-size:1rem;">🎯 每日答题</span>

      </div>
      <div style="height:6px;background:#f0f0f0;border-radius:3px;">
